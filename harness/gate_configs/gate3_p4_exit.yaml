# Gate 3: P4 phase-exit (testing complete). Replaces auto-research P4.
# First full 14-dim evaluation. CRG fully enabled.
gate: 3
trigger: phase_exit
phase: 4
scope: full_phase
dimensions:
  - { name: linting,               tier: 1, threshold: 90,  weight: 0.10, tool: ruff,              requires_tool_execution: true }
  - { name: type_safety,           tier: 1, threshold: 85,  weight: 0.10, tool: pyright,            requires_tool_execution: true }
  - { name: test_coverage,         tier: 1, threshold: 80,  weight: 0.10, tool: pytest-cov,         requires_tool_execution: true }
  - { name: security,              tier: 2, threshold: 80,  weight: 0.10, tool: bandit,             requires_tool_execution: true }
  - { name: secrets_scanning,      tier: 1, threshold: 100, weight: 0.08, tool: gitleaks,           requires_tool_execution: true }
  - { name: license_compliance,    tier: 1, threshold: 100, weight: 0.07, tool: scancode,           requires_tool_execution: true }
  - { name: mutation_testing,      tier: 1, threshold: 70,  weight: 0.07, tool: mutmut,             requires_tool_execution: true }
  - { name: integration_coverage,  tier: 2, threshold: 60,  weight: 0.05, tool: pytest-cov-integration,             requires_tool_execution: true }
  - { name: architecture,          tier: 3, threshold: 80,  weight: 0.07, tool: code-review-graph,           requires_tool_execution: true }
  - { name: readability,           tier: 3, threshold: 80,  weight: 0.06, tool: radon-mi,           requires_tool_execution: true }
  - { name: error_handling,        tier: 3, threshold: 80,  weight: 0.07, tool: ast-error-handling,   requires_tool_execution: true }
  - { name: documentation,         tier: 3, threshold: 75,  weight: 0.00, tool: ast-docstrings,         requires_tool_execution: true }
  - { name: test_assertion_quality, tier: 2, threshold: 60,  weight: 0.01, tool: ast-assertions,             requires_tool_execution: true }
  - { name: performance,           tier: 3, threshold: 75,  weight: 0.02, tool: pytest-benchmark,   requires_tool_execution: true }
  # PR 4: see gate2_p3_exit.yaml for semantics.
  - { name: traceability,          tier: 2, threshold: 100, weight: 0.10, tool: harness-trace,  requires_tool_execution: false }
  # v2.9 C2: framework-owned adversarial bug-hunt verdict (weight 0 — blocking
  # by threshold, like traceability). Score comes from bug_hunt_verifier over
  # .methodology/bug_hunt_report.json (protocol: ssi/prompts/hunt_bugs.md;
  # targeting: harness_cli bug-hunt-targets). 100 = no unresolved confirmed
  # critical/high findings; anything else = 0/BLOCK. Agents must NOT write a
  # .sessi-work score file for this dimension.
  - { name: adversarial_review,    tier: 2, threshold: 100, weight: 0.00, tool: bug-hunt-report, requires_tool_execution: false }
blocking: true
score_gate: 80
max_rounds: 3
early_stop: true
saturation_rounds: 3
mutation_testing:
  median_runs: 3
  timeout_per_run: 120
  objective_primary: true
crg:
  enabled: true
  reconnaissance: true
  tier3_guidance: true
  impact_threshold: 0.7
  drift_threshold: 0.4
replaces: auto_research_p4

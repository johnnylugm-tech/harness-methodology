# Gate 1: P3/P4/P5/P7/P8 per-FR check. Replaces check_fr_full.py Layer 3.
# No auto-iteration: failure -> developer fixes -> manual re-run.
# P6 has no per-FR Gate 1 — it uses a single Gate 4 (14-dim full audit) at phase exit.
gate: 1
trigger: per_fr_completion
scope: single_fr
# The composite floor, declared here for the same reason gates 2/3/4 declare
# theirs (75/80/85): `load_score_gate` is the one reader, and a gate that
# declares nothing forces every consumer to answer the question itself. Gate 1
# went without it until Round 70, and the four consumers that had to guess gave
# three different answers — see tests/test_gate1_score_gate_ssot.py. 80 is what
# the GATE1 dispatch prompt has told the evaluating LLM since it was written.
score_gate: 80
dimensions:
  - { name: linting,               tier: 1, threshold: 100, weight: 0.25, tool: ruff,        requires_tool_execution: true }
  - { name: type_safety,           tier: 1, threshold: 100, weight: 0.25, tool: pyright,     requires_tool_execution: true }
  - { name: test_coverage,         tier: 1, threshold: 80, weight: 0.25, tool: pytest-cov,  requires_tool_execution: true }
  - { name: architecture_constraints, tier: 1, threshold: 100, weight: 0.25, tool: import-linter, requires_tool_execution: true }
blocking: true
early_stop: false
max_rounds: 1
replaces: check_fr_full_layer3

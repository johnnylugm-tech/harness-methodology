# Gate 2: P3 phase-exit (all FRs complete). Replaces auto-research P3.
# First full security + mutation pass before P4 Testing begins.
gate: 2
trigger: phase_exit
phase: 3
scope: full_phase
dimensions:
  - { name: linting,               tier: 1, threshold: 90,  weight: 0.12, tool: ruff,           requires_tool_execution: true }
  - { name: type_safety,           tier: 1, threshold: 85,  weight: 0.12, tool: pyright,         requires_tool_execution: true }
  - { name: test_coverage,         tier: 1, threshold: 80,  weight: 0.12, tool: pytest-cov,     requires_tool_execution: true }
  - { name: security,              tier: 2, threshold: 80,  weight: 0.12, tool: bandit,          requires_tool_execution: true }
  - { name: secrets_scanning,      tier: 1, threshold: 100, weight: 0.08, tool: gitleaks,       requires_tool_execution: true }
  - { name: license_compliance,    tier: 1, threshold: 100, weight: 0.08, tool: scancode,       requires_tool_execution: true }
  - { name: mutation_testing,      tier: 1, threshold: 70,  weight: 0.10, tool: mutmut,         requires_tool_execution: true }
  - { name: integration_coverage,  tier: 2, threshold: 60,  weight: 0.10, tool: pytest-cov-integration,         requires_tool_execution: true }
  - { name: test_assertion_quality, tier: 2, threshold: 60,  weight: 0.06, tool: ast-assertions,         requires_tool_execution: true }
  - { name: execute_verification_target, tier: 1, threshold: 100, weight: 0.10, tool: system-verification, requires_tool_execution: true }
  # PR 4: closed-loop bidirectional traceability. requires_tool_execution: false
  # means S4 (cross-validation) skips the tool-runner; compute_trace_dimension
  # patches the score in at finalize time. 4a threshold 100% applies to FRs
  # with status ∈ {IN_PROGRESS, VERIFIED}; PENDING FRs not in denominator.
  - { name: traceability,          tier: 2, threshold: 100, weight: 0.10, tool: harness-trace,  requires_tool_execution: false }
blocking: true
score_gate: 75
max_rounds: 3
early_stop: true
saturation_rounds: 3
mutation_testing:
  median_runs: 3
  timeout_per_run: 120
  objective_primary: true
crg:
  impact_check: true
  impact_threshold: 0.7
replaces: auto_research_p3

  - { name: traceability,          tier: 2, threshold: 100, weight: 0.08, tool: harness-trace,  requires_tool_execution: false }
blocking: true
score_gate: 85
max_rounds: 3
early_stop: true
saturation_rounds: 3
crg:
  enabled: true
  reconnaissance: true
  tier3_guidance: true
  impact_threshold: 0.7
  drift_threshold: 0.4
replaces: p6_sop_entirely

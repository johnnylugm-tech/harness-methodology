# Gate 4: P6 full-project. Completely replaces P6 SOP.
# Final gate: all 8 phases done, full CRG, Hermes reviewer APPROVE required.
gate: 4
trigger: phase_exit
phase: 6
scope: full_project
dimensions:
  - { name: linting,               tier: 1, model: gemini-flash, threshold: 90,  weight: 0.07, tool: ruff,           requires_tool_execution: true }
  - { name: type_safety,           tier: 1, model: gemini-flash, threshold: 85,  weight: 0.07, tool: mypy,           requires_tool_execution: true }
  - { name: test_coverage,         tier: 1, model: gemini-flash, threshold: 80,  weight: 0.07, tool: pytest-cov,     requires_tool_execution: true }
  - { name: security,              tier: 2, model: gemini-flash, threshold: 80,  weight: 0.08 }
  - { name: secrets_scanning,      tier: 1, model: gemini-flash, threshold: 100, weight: 0.07, tool: gitleaks,       requires_tool_execution: true }
  - { name: license_compliance,    tier: 1, model: gemini-flash, threshold: 100, weight: 0.07, tool: scancode,       requires_tool_execution: true }
  - { name: mutation_testing,      tier: 1, model: gemini-flash, threshold: 70,  weight: 0.08, tool: mutmut,         requires_tool_execution: true }
  - { name: architecture,          tier: 3, model: claude,       threshold: 80,  weight: 0.14 }
  - { name: readability,           tier: 3, model: claude,       threshold: 80,  weight: 0.08 }
  - { name: error_handling,        tier: 3, model: claude,       threshold: 80,  weight: 0.08 }
  - { name: documentation,         tier: 3, model: claude,       threshold: 75,  weight: 0.06 }
  - { name: performance,           tier: 3, model: claude,       threshold: 75,  weight: 0.06 }
  - { name: integration_coverage,  tier: 2, model: gemini-flash, threshold: 75,  weight: 0.05, tool: pytest,         requires_tool_execution: true }
  - { name: test_assertion_quality, tier: 2, model: gemini-flash, threshold: 70,  weight: 0.02, tool: pytest,         requires_tool_execution: true }
blocking: true
score_gate: 85
max_rounds: 3
early_stop: true
saturation_rounds: 3
mutation_testing:
  median_runs: 3
  timeout_per_run: 120
  objective_primary: true
crg:
  enabled: true
  reconnaissance: true
  tier3_guidance: true
  impact_threshold: 0.7
  drift_threshold: 0.4
replaces: p6_sop_entirely

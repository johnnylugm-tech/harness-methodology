# Gate 4: P6 full-project. Completely replaces P6 SOP.
# Final gate: all 8 phases done, full CRG, fully automated (no human approval step).
gate: 4
trigger: phase_exit
phase: 6
scope: full_project
dimensions:
  - { name: linting,               tier: 1, threshold: 90,  weight: 0.07, tool: ruff,             requires_tool_execution: true }
  - { name: type_safety,           tier: 1, threshold: 85,  weight: 0.07, tool: pyright,           requires_tool_execution: true }
  - { name: test_coverage,         tier: 1, threshold: 80,  weight: 0.07, tool: pytest-cov,        requires_tool_execution: true }
  - { name: security,              tier: 2, threshold: 80,  weight: 0.08, tool: bandit,            requires_tool_execution: true }
  - { name: secrets_scanning,      tier: 1, threshold: 100, weight: 0.07, tool: gitleaks,          requires_tool_execution: true }
  - { name: license_compliance,    tier: 1, threshold: 100, weight: 0.07, tool: scancode,          requires_tool_execution: true }
  - { name: mutation_testing,      tier: 1, threshold: 70,  weight: 0.08, tool: mutmut,            requires_tool_execution: true }
  - { name: architecture,          tier: 3, threshold: 80,  weight: 0.10, tool: code-review-graph,          requires_tool_execution: true }
  - { name: readability,           tier: 3, threshold: 80,  weight: 0.08, tool: readability-v2,          requires_tool_execution: true }
  - { name: error_handling,        tier: 3, threshold: 80,  weight: 0.06, tool: ast-error-handling,  requires_tool_execution: true }
  - { name: documentation,         tier: 3, threshold: 75,  weight: 0.06, tool: ast-docstrings,        requires_tool_execution: true }
  - { name: performance,           tier: 3, threshold: 75,  weight: 0.06, tool: pytest-benchmark,  requires_tool_execution: true }

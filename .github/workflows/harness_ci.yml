name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  framework-self-tests:
    name: Framework Self-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pyyaml ruff mypy
          pip install -r requirements.txt
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            | sudo tar -xz -C /usr/local/bin gitleaks

      # Round 67 站5: one list of checks, run here and by scripts/hooks/pre-push.
      # Splitting it back into per-step `run:` lines re-creates the drift this
      # replaced — the hook cannot see a step that exists only in this file.
      # Pinned by tests/test_selfcheck_single_source.py.
      - name: Self-check (lint + guard registry + unit tests)
        run: scripts/self_check.sh

  validate-manifests:
    name: Validate Module Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate manifests + SKILL.md frontmatter
        run: python scripts/list-modules.py --validate

  validate-cross-refs:
    name: Validate Cross-References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project (for imports)
        run: pip install -r requirements.txt

      - name: Validate CLASSIFICATION_TABLE ↔ STRATEGY_REGISTRY
        run: python scripts/validate_cross_refs.py

  phase-quality-gate:
    name: Phase Quality Gate (C1/C2/C4/C5/C9 + TDD links + coverage)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pytest-cov pyyaml mypy
          pip install -r requirements.txt

      - name: Get current phase
        id: phase
        run: |
          PHASE=$(python3 scripts/ci_state_helper.py get current_phase \
            --default 0 --state-file ".methodology/state.json")
          echo "phase=$PHASE" >> $GITHUB_OUTPUT

      - name: Detect RED-phase commit (TDD sub-agent — intentionally failing test)
        # run-fr-step --step TDD-RED commits with message "test(RED): failing test for FR-XX".
        # A RED commit is expected to have a failing test — skip pytest/coverage for this push.
        # All other steps (audit-phase, spec-coverage-check) still run normally.
        id: red_check
        run: |
          MSG=$(git log -1 --format="%s")
          if echo "$MSG" | grep -qE "^test\(RED\):"; then
            echo "is_red=true" >> $GITHUB_OUTPUT
            echo "RED-phase commit detected — pytest/coverage check skipped for this push."
          else
            echo "is_red=false" >> $GITHUB_OUTPUT
          fi

      # Round 80 站4. Unconditional on purpose: every check below is gated on
      # the phase read above, and .gitignore excludes .methodology/state.json,
      # so a CI checkout never has one and `current_phase` is always 0. Before
      # this step the job reported success having run 4 of its 13 steps — the
      # four it skipped being its only four checks — with nothing in the log
      # saying so. A check that did not run must not read like one that passed
      # (Round 79 站5's rule, applied here rather than only to the pre-push
      # hook). harness-methodology keeps no phase state deliberately; that is a
      # sentence the log has to contain, not a silence.
      - name: Applicability of the phase checks
        run: |
          PHASE="${{ steps.phase.outputs.phase }}"
          if [ "$PHASE" -ge 1 ]; then
            echo "phase $PHASE — the checks below run against this tree."
          else
            echo "not applicable: no .methodology/state.json in this checkout"
            echo "  (it is gitignored — harness-methodology is the framework,"
            echo "   not an ASPICE project, and keeps no phase state), so"
            echo "   current_phase is 0 and every check in this job is skipped:"
            echo "     - Phase artifact audit (audit-phase)"
            echo "     - TDD test execution + coverage"
            echo "     - D4 trace link (spec-coverage-check)"
            echo "     - Trace attestation verify"
            echo "   This job passing means those did NOT run. The framework's"
            echo "   own checks are the Framework Self-Tests job."
          fi

      - name: Phase artifact audit — deliverables / constitution / gate scores (P1+)
        if: steps.phase.outputs.phase >= 1
        run: |
          python harness_cli.py audit-phase \
            --phase ${{ steps.phase.outputs.phase }} \
            --project . \
            --fail-on-critical

      - name: TDD test execution + coverage (P3+)
        # Coverage target: 100% on 03-development/src only (TDD-governed source).
        # Use `# pragma: no cover` with explicit justification for genuine exceptions.
        # Skipped on RED-phase commits (test(RED): ...) — those intentionally fail.
        if: steps.phase.outputs.phase >= 3 && steps.red_check.outputs.is_red != 'true'
        run: |
          pytest --tb=short -q \
            --cov=03-development/src \
            --cov-fail-under=100 || {
            echo ""
            echo "Test or coverage failure."
            echo "TDD requires 100% coverage on 03-development/src."
            echo "If a line is genuinely untestable, add: # pragma: no cover"
            exit 1
          }

      - name: D4 trace link — TEST_SPEC → tests/ (P3+, unified v2.6)
        # spec-coverage: P3=60%  P4-P5=80%  P6+=90%
        if: steps.phase.outputs.phase >= 3
        run: |
          PHASE=${{ steps.phase.outputs.phase }}
          if [ "$PHASE" -ge 6 ]; then
            SC_THRESH=90.0
          elif [ "$PHASE" -ge 4 ]; then
            SC_THRESH=80.0
          else
            SC_THRESH=60.0
          fi
          python harness_cli.py spec-coverage-check \
            --project . --threshold $SC_THRESH

      - name: Trace attestation verify (PR 3, P3+)
        if: steps.phase.outputs.phase >= 3
        # Exit 2 (missing) is OK on first run; exit 0 clean; exit 1/3 block.
        run: |
          python harness_cli.py verify-trace \
            --project . --gate ${{ steps.phase.outputs.phase }} \
            || EXIT=$?; \
            if [ "$EXIT" != "2" ]; then exit $EXIT; fi

  p8-archive-check:
    name: P8 Archive & HANDOVER Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check if P8 is complete
        id: check_p8
        run: |
          STATE_FILE=".methodology/state.json"
          # CV-5: safe state.json parsing via helper. Returns "false" on any
          # read failure (missing/corrupted/empty file) so CI continues.
          IS_P8=$(python3 scripts/ci_state_helper.py is-p8 --state-file "$STATE_FILE")
          echo "is_p8=$IS_P8" >> $GITHUB_OUTPUT

      # Round 80 站4, the sibling of the same statement in phase-quality-gate.
      # `ci_state_helper.py is-p8` answers "false" on any read failure and says
      # so in the step above's comment, and there is no .methodology/state.json
      # to read, so both validations below are skipped on every run — measured
      # 5 of 7 steps executed at dff609e6, the two skipped being the only two
      # validations.
      - name: Applicability of the P8 validations
        run: |
          if [ "${{ steps.check_p8.outputs.is_p8 }}" = "true" ]; then
            echo "P8 complete — the validations below run against this tree."
          else
            echo "not applicable: no .methodology/state.json in this checkout"
            echo "  (gitignored; this repo is the framework and keeps no phase"
            echo "   state), so is-p8 is false and both validations are"
            echo "   skipped: .methodology-archive presence, and HANDOVER.md"
            echo "   Phase-9 references. This job passing means neither ran."
          fi

      - name: Validate .methodology-archive exists (P8 only)
        if: steps.check_p8.outputs.is_p8 == 'true'
        run: |
          if [ ! -d ".methodology-archive" ]; then
            echo "ERROR: .methodology-archive/ does not exist."
            echo "P8 completion requires archiving all phase artifacts."
            exit 1
          fi
          echo "OK: .methodology-archive/ exists."

      - name: Validate HANDOVER.md has no Phase 9 references (P8 only)
        if: steps.check_p8.outputs.is_p8 == 'true'
        run: |
          if [ -f "HANDOVER.md" ]; then
            if grep -qi "phase 9\|phase9\|phase9_plan" HANDOVER.md; then
              echo "ERROR: HANDOVER.md references non-existent Phase 9."
              echo "P8 is the final phase. Remove all Phase 9 references."
              grep -ni "phase 9\|phase9" HANDOVER.md || true
              exit 1
            fi
            echo "OK: HANDOVER.md has no Phase 9 references."
          fi

name: Harness CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  framework-self-tests:
    name: Framework Self-Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pyyaml ruff
          pip install -r requirements.txt || true

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests
        run: pytest tests/ -v --tb=short

  validate-manifests:
    name: Validate Module Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate manifests + SKILL.md frontmatter
        run: python scripts/list-modules.py --validate

  validate-cross-refs:
    name: Validate Cross-References
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install project (for imports)
        run: pip install -r requirements.txt || true

      - name: Validate CLASSIFICATION_TABLE ↔ STRATEGY_REGISTRY
        run: python scripts/validate_cross_refs.py

  push-milestone-enforcement:
    name: Enforce push-milestone (no --no-verify bypass)
    runs-on: ubuntu-latest
    # Only enforce on pushes to main, not PRs (PRs may not have state.json)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check last_milestone_command in state.json
        run: |
          STATE_FILE=".methodology/state.json"
          if [ ! -f "$STATE_FILE" ]; then
            echo "INFO: No state.json found — project not yet initialized, skipping check."
            exit 0
          fi
          # CV-5: use ci_state_helper.py for safe state.json parsing.
          # Bare `python3 -c "json.load(...)"` raises uncaught traceback on
          # corrupted/empty state.json → entire CI run dies.
          PHASE=$(python3 scripts/ci_state_helper.py get current_phase --default 0 --state-file "$STATE_FILE")
          # Only enforce milestone tracking for P3+ projects
          if [ "$PHASE" -lt 3 ]; then
            echo "INFO: Phase $PHASE < 3 — push-milestone not yet required."
            exit 0
          fi
          CMD=$(python3 scripts/ci_state_helper.py get last_milestone_command --default "" --state-file "$STATE_FILE")
          if [ -z "$CMD" ]; then
            echo "ERROR: state.json has no last_milestone_command field."
            echo "This means git push was used directly instead of:"
            echo "  python harness_cli.py push-milestone --type <type> --project ."
            echo "Use push-milestone for all P3+ milestone pushes."
            exit 1
          fi
          echo "OK: last_milestone_command = $CMD"

  agent-b-approval-check:
    name: Agent B Approval Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt || true

      - name: Check if Agent B approvals are required
        id: check_phase
        run: |
          STATE_FILE=".methodology/state.json"
          # CV-5: safe state.json parsing via helper.
          PHASE=$(python3 scripts/ci_state_helper.py get current_phase --default 0 --state-file "$STATE_FILE")
          echo "phase=$PHASE" >> $GITHUB_OUTPUT

      - name: Verify Agent B approvals (P1/P2 only)
        if: steps.check_phase.outputs.phase >= 1 && steps.check_phase.outputs.phase <= 2
        run: |
          python harness_cli.py verify-agent-b-approvals \
            --phase ${{ steps.check_phase.outputs.phase }} \
            --project . || {
              echo ""
              echo "Agent B review files are missing or incomplete."
              echo "Each deliverable needs .methodology/agent_b_approvals/<id>.json"
              echo "with review_status=APPROVE and docs_embedded=[SRS.md] (P1) or [SRS.md, SAD.md] (P2)"
              exit 1
            }

  phase-quality-gate:
    name: Phase Quality Gate (C1/C2/C4/C5/C9)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pytest pyyaml
          pip install -r requirements.txt || true

      - name: Get current phase
        id: phase
        run: |
          PHASE=$(python3 scripts/ci_state_helper.py get current_phase \
            --default 0 --state-file ".methodology/state.json")
          echo "phase=$PHASE" >> $GITHUB_OUTPUT

      - name: Phase artifact audit — deliverables / constitution / gate scores (P1+)
        if: steps.phase.outputs.phase >= 1
        run: |
          python harness_cli.py audit-phase \
            --phase ${{ steps.phase.outputs.phase }} \
            --project . \
            --fail-on-critical

      - name: TDD test execution (P3+)
        if: steps.phase.outputs.phase >= 3
        run: pytest --tb=short -q

  p8-archive-check:
    name: P8 Archive & HANDOVER Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check if P8 is complete
        id: check_p8
        run: |
          STATE_FILE=".methodology/state.json"
          # CV-5: safe state.json parsing via helper. Returns "false" on any
          # read failure (missing/corrupted/empty file) so CI continues.
          IS_P8=$(python3 scripts/ci_state_helper.py is-p8 --state-file "$STATE_FILE")
          echo "is_p8=$IS_P8" >> $GITHUB_OUTPUT

      - name: Validate .methodology-archive exists (P8 only)
        if: steps.check_p8.outputs.is_p8 == 'true'
        run: |
          if [ ! -d ".methodology-archive" ]; then
            echo "ERROR: .methodology-archive/ does not exist."
            echo "P8 completion requires archiving all phase artifacts."
            exit 1
          fi
          echo "OK: .methodology-archive/ exists."

      - name: Validate HANDOVER.md has no Phase 9 references (P8 only)
        if: steps.check_p8.outputs.is_p8 == 'true'
        run: |
          if [ -f "HANDOVER.md" ]; then
            if grep -qi "phase 9\|phase9\|phase9_plan" HANDOVER.md; then
              echo "ERROR: HANDOVER.md references non-existent Phase 9."
              echo "P8 is the final phase. Remove all Phase 9 references."
              grep -ni "phase 9\|phase9" HANDOVER.md || true
              exit 1
            fi
            echo "OK: HANDOVER.md has no Phase 9 references."
          fi

[mutmut]
# Mutation test scope — all measured modules.
# Note: uses mutmut 2.x syntax (not 3.x); pin: pip install "mutmut==2.5.1"
# To run a single scope: temporarily narrow paths_to_mutate and runner.
paths_to_mutate=steering/steering_loop.py,enforcement/policy_engine.py,gap_detector/detector.py
runner=python3 -m pytest tests/test_steering.py tests/test_policy_engine.py tests/test_gap_detector.py tests/test_w7_gap_fill.py tests/test_w6_gap_fill.py -x -q --tb=no

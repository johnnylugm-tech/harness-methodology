[mutmut]
# Mutation test scope — all measured modules.
# Note: uses mutmut 2.x syntax (not 3.x); pin: pip install "mutmut==2.5.1"
# To run a single scope: temporarily narrow paths_to_mutate and runner.
paths_to_mutate=harness/tool_runners.py,core/quality_gate/sab_parser.py,harness/ssi/scripts/score.py,core/quality_gate/constitution/runner.py,harness/harness_bridge.py
runner=python3 -m pytest tests/test_tool_runners.py tests/test_sab_parser.py tests/test_core_flows_mutation.py tests/test_score_validator.py tests/test_score_compute.py tests/test_constitution_runner.py tests/test_constitution_oracle.py tests/test_harness_bridge.py tests/test_anti_fabrication.py tests/test_harness_bridge_oracle.py -x -q --tb=no

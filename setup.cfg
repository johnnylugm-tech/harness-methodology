[mutmut]
# Mutation test scope: core scorers + NFR mapping.
# harness_bridge.py (267 mutable nodes) excluded — too slow for local runs.
# To run: mutmut run && mutmut results
# Fill mutation_baseline.json with the kill rates after first run.
# Note: uses mutmut 2.x syntax (not 3.x); pin: pip install "mutmut==2.5.1"
paths_to_mutate=harness/tool_runners.py,core/quality_gate/sab_parser.py
runner=python3 -m pytest tests/test_tool_runners.py tests/test_sab_parser.py -x -q --tb=no

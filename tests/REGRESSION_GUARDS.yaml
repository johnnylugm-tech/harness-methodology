- test: tests/test_trace_dimension_equivalence.py::test_the_combination_that_broke_the_previous_fix
  bug: "one-verdict-two-formulas class (Round 19 站3): compute_trace_dimension AND-s each component against its own threshold to get `passed`, while every consumer persists merged_pct as a single score against a single threshold (cli/gate_cmds.py's result patch, harness_bridge._override_traceability_dim_score). 7c60859 added `threshold_effective` to reconcile them using 'the threshold of whichever component binds the min', and the 8 tests shipped with it assert override behaviour — none assert the equivalence the field exists to create. The rule still breaks whenever the FAILING component is not the binding one: 4a=99.9 (one FR untested, bar 100, FAILS) with 4b=90 (bar 60, passes, and is the min) yields effective=60, and 90 >= 60 reports PASS. 55 parametrised combinations fail under the old rule. Nothing broke in production only because cli/gate_cmds.py checks `passed` and returns 1 before harness_bridge scores the dimension from the persisted number — a correctness property resting on which layer runs first"
  fixed_in: "Round 19 站3 (resolve_threshold_effective: if anything fails, compare against the highest failing bar — merged, being the min, is then necessarily below it; otherwise keep the binding component's threshold so the printed number stays meaningful. compute_trace_dimension delegates to it, with a test asserting it does not re-derive the rule inline)"

- test: tests/test_env_contract.py::TestEvaluation::test_same_contract_same_environment_is_deterministic
  bug: "LLM-verdict-with-no-deterministic-counterpart class (Round 20 站1): env-check's `ready` was whatever the sub-agent asserted. Round 24 (37adc43) recorded the same documented env var, against the same UNCHANGED project state, classified optional_missing (ready=true) in one workflow run and required+present:false (ready=false, a false FAIL) in another. Three layers read that verdict — the agent's self-report, run-env-check's exit code, and the workflow JS 'Bug #127 anti-fabrication' cross-check — and every one read the SAME field, so none could contradict it. _verify_env_check_claims re-verifies only `present: true` claims, so BOTH shapes of the bug sat in its blind spot by construction. The gate scoring chain has had an independent counterpart since S4 (harness_bridge.py:970 re-runs the tools); env-check had none, which is exactly the re-open condition recorded against R16-3. Root cause is a conflation: classification (does this project run without FOO? — its docs decide) and verification (is FOO exported now? — the environment decides, and it is computable) were answered by one mechanism"
  fixed_in: "Round 20 站1 (core/quality_gate/env_contract.py: classification stored in version-controlled .methodology/env_contract.json keyed by a sha256 of the exact documents evaluation_prompt() shows the classifier; ready computed by env_verify's probes on every run via a single _finalize_env_result path. core/quality_gate/env_verify.py extracted the probing from the anti-fabrication check first, with that check's 19 tests as the parity net)"


- test: tests/test_no_hardcoded_paths.py::test_no_root_relative_test_or_src_dirs_outside_layout
  bug: "path-SSOT half-coverage class (Round 20 站2): Round S4 built ProjectLayout and a lint to enforce it, but the lint has exactly one rule and it matches only phase directories (`/ \"0X-name\"`). Test and src directories were never in scope — and that is where the same class shipped three times, each found by a real run rather than a test: Round 22 (4aa6ff2, advance-phase's unscoped pytest collecting the vendored harness/tests/), Round 25 (7af95ba, build_traceability's NFR scan reading an empty `project / \"tests\"` so every NFR rendered PENDING — whose own commit message notes the fix 'was already proven correct at spec_tracking_checker.py:391', a sibling never swept for), and this station's find: core/auto_fix/strategies.fix_low_coverage, the worst of the three because it WRITES — mkdir'ing a stray tests/ at the project root, generating stubs the project's pytest never collects, and reporting the coverage deficit fixed. Live path at the time (STRATEGY_REGISTRY['low_coverage'], dispatched from core/auto_fix/__init__.py); R48 站6 retired that strategy and R49-C deleted its code, so the third example is now history rather than a live writer — the guard's subject was always the AST lint, which still scans every file. The guard is AST-based: the first version scanned text and flagged its own docstring, since prose ABOUT the pattern reads identically to the pattern"

- test: tests/test_failure_corpus_coverage.py::test_a_successful_dispatch_is_never_classified_as_a_failure
  bug: "invented-failure class (Round 19 站1, a defect introduced and caught inside the same station): _log_dispatch writes `error_output` on EVERY entry — on success it holds the sub-agent's ordinary reply text — and `error_class` only on failures, precisely because of that asymmetry. The first version of _effective_error_class re-derived the class for all entries, so ordinary success replies were run through error signatures and 3 taskq successes matched (one was a plain 'Committed successfully.'). A classifier that invents failures is worse than one that misses them: the corpus ratchet would still have read 0 while run-report grew phantom infra incidents. Re-derivation is now restricted to is_failure_entry() and this guard pins the asymmetry"

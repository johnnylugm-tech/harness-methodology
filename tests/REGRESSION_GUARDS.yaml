- test: tests/test_handover_idempotence.py::test_a_milestone_rerun_creates_no_second_commit
  bug: "timestamp-guarantees-a-diff class (Round 20 站3), the sibling Round 18 站3 fixed for attestations and did not sweep for. taskq's Phase 4 produced three commits with an identical subject (feat(P4-pre-gate3): all 5 FR(s) Gate1 re-eval PASS), the last changing nothing but two timestamps, and all three landing AFTER Gate 3 had already passed so even the subject was false. git_strategy._commit was never at fault — it already declines a clean tree — but HANDOVER.md's `**Generated**` line is regenerated on every milestone and guaranteed a diff whether or not anything moved, so the tree was never clean. The workflow prompt calls that milestone '(Idempotent; skip if already snapshotted.)' — a claim about the command that the command did not honour. Related but deliberately unfixed: p4-pre-gate3 is the only milestone in phase4-testing.js without a `git log --grep` GUARD before it (p4-mid has one, as do phase3's three), which is why it was invoked three times at all"

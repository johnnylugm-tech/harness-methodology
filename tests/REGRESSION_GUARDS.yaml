  bug: "test-freezes-the-defect class, second instance (Round 20 站1; the first was Round 19 站2's envelope test). TestCmdRunEnvCheck used to write `{\"ready\": true/false}` and assert the exit code followed it — encoding 'the sub-agent's assertion IS the verdict' as the specification, so the defect could not fail a test. The three tests now drive the CLASSIFICATION and let the exit code be derived from a measurement, and this one is the direct pin: an agent asserting ready=true while a var it itself classified as required is unset must exit 1"

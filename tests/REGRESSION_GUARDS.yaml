- test: tests/test_doctor.py::TestGate1Evidence::test_skip_sourced_row_alone_does_not_satisfy_the_claim
  bug: "shadow-channel-read-as-corroboration class (Round 20 站4). core/doctor.py accepted `has_sentinel or fr_key in ts_frs` as evidence for a quality_complete claim, an `or` that reads like two corroborating sources. They are not independent: gate_timestamps rows can be written by cli/fr_cmds.py's GATE1-DELTA `already done → skip` branch, whose precondition is that _fr_step_already_done ALREADY found a sentinel or commit — so that row is a shadow of the sentinel channel, not a second opinion about it. taskq's Phase 4 wrote five such rows within 3.1 seconds with zero dispatches behind them. Nothing was forged and this is recorded as a design weakness rather than a live wound: the skip precondition guarantees real evidence exists elsewhere. What it defeats is a READER, including the next person to change that check, who cannot tell the two kinds of row apart"

- test: tests/test_handover_generator.py::TestCmdAdvancePhase::test_corrupt_manifest_blocks_advance_with_recovery_command
  bug: "check-only-on-one-caller's-path class (Round 22 站2). quality_manifest.json integrity was verified exclusively from workflow JS — an entry-point phase() box plus one sub-agent dispatch per Advance round, each shelling out to `check-manifest-integrity`, itself a thin wrapper around PhaseHooks.preflight_manifest_integrity(). advance-phase, which COMMITS .methodology/ wholesale, never ran it: _advance_prechecks had no such step. So every non-workflow caller — a human running advance-phase by hand, a session resumed after a crash, CI — could bake a truncated fr_ids / cleared traceability / wiped gate1 straight into git history, which is exactly what commit 3198402 did once. tests/test_workflow_plan_alignment.py's own registry stated the hole in prose ('A human running the plan by hand has no equivalent step') and filed it as a justified runtime-only invention rather than a gap. The entry-point call was separately redundant: Entry & Preflight runs `run-phase --phase N` in the box immediately before it, and PREFLIGHT_CHECKS[0] IS preflight_manifest_integrity"
  fixed_in: "Round 22 站2 (cli/phase_cmds.py::_advance_prechecks runs it first — before every other precheck, since they all read the manifest — returning the new exit 27 with the restore command in its [BLOCKED] message. Both advance-phase entry paths, normal and re-verify, go through _advance_prechecks. The entry-point and Advance-loop dispatches were removed from all six workflows; the helper survives only where advance-phase does not cover the call site — phase3's Gate-2 round loop and phase8's Final Push. Counterexample-verified: neutralising the CLI check drops the exit code back to 8)"

- test: tests/test_workflow_sim.py::test_sim_testbed_passes
  bug: "relocation-leaves-a-duplicate risk (Round 22 站2; guarded scenarios are sim_runner.test.mjs section 9, floor raised 41 -> 48). Once advance-phase enforces manifest integrity itself, any surviving workflow-side dispatch for the same check is pure cost — but nothing structural prevents one being re-added, and re-adding it produces no failing signal on its own (the check would simply run twice and pass twice). The inverse risk is equally silent: deleting the two call sites advance-phase does NOT cover (phase3's Gate-2 round loop, where a mid-loop fix attempt can reintroduce corruption before finalize-gate commits, and phase8's Final Push, which is push-milestone rather than advance-phase) would leave those two paths unguarded with every test still green"
  fixed_in: "Round 22 站2 (one scenario asserts the exact per-file set of surviving integrity dispatches — phase8 only — and that neither the entry-point label nor advance-integrity-r* reappears anywhere; a second drives phase3 into its Gate-2 round loop and requires the per-round check to fire there. Counterexample-verified: re-injecting the Advance-loop dispatch names phase7 in the first scenario's failure)"

- test: tests/test_workflow_sim.py::test_sim_testbed_passes
  bug: "probe-checks-what-the-next-command-checks class (Round 22 站3; guarded scenarios are sim_runner.test.mjs section 10, floor raised 48 -> 51). Every FR-loop phase spent a `ctx-check-N` sub-agent dispatch running `json.load(ctxFile)` to prove the ctx file was parseable, immediately before a `load-ctx-aN` dispatch whose own command also runs `json.load(ctxFile)` and exits nonzero on exactly the same inputs — the probe's failure set is a strict subset of the read's. The two outcomes it distinguished (file missing vs. file unparseable) had identical handling: regenerate. On phase3 it was worse than redundant: Fix D (2026-07-18) forces a fresh load-context on attempt 1 via `attempt === 1 || !(existsVerdict…)`, which short-circuits before the verdict is read, so on the attempt that matters the probe ran, answered, and was discarded outright. This is the same shape as Round 20's meta-pattern — several layers interrogating one source — costing one dispatch per phase, five phases per run"
  fixed_in: "Round 22 站3 (the read is the check: a failed load-ctx now routes to the same regeneration path the probe used to trigger, and phase3 keeps Fix D by making attempt 1 regenerate unconditionally before reading. Three scenarios pin it: one dispatch on a clean read, phase3's forced attempt-1 regen, and recovery-after-regen on a failed read. Counterexample-verified: removing the regen leg turns the third red)"

- test: tests/test_workflowgen.py::TestPollBackoff::test_env_check_poll_starts_short_and_backs_off
  bug: "poll interval sized for the worst case, paid in the common case (Round 22 站4). Both background-poll prompts opened with a flat sleep matched to their slowest possible run: 60s for env-check, 30s per FR for the GATE1-DELTA fast-path probe. Round 20 站1 then made run-env-check return in about a second whenever env_contract.json is current (source docs unchanged -> deterministic verification, no sub-agent spawned, cli/gate_cmds.py), and an unchanged FR hits GATE1-DELTA's in-CLI short-circuit just as fast — but the prompts never moved, so every phase slept a full minute on a finished command, and the per-FR probe, which walks FRs one at a time, slept 30s x N (about ten minutes on a 20-FR project). Pure wall-clock, invisible to every correctness check: the run still passed, just later"
  fixed_in: "Round 22 站4 (backoff sequences — env-check 5/10/20/30 then 60s capped at 22 polls ~19min; fast-path probe 5/10 then 30s capped at 42 polls ~20min — so the total tolerance for a genuinely long run is unchanged. The full per-FR loop keeps its flat 30s/cap-60: that path can chain an entire TDD cycle and a short first sleep buys nothing there, pinned by test_the_full_per_fr_loop_keeps_its_flat_interval. The authoritative signals are unchanged — `kill -0` DONE and the final RC= line, never the log contents)"

- test: tests/test_handover_generator.py::TestCmdAdvancePhase::test_push_failure_blocks_but_keeps_the_commit
  bug: "push-lives-in-the-prompt-layer class (Round 23 站1; sibling guards test_push_is_off_by_default and test_push_flag_pushes_after_the_commit). advance-phase committed the handover locally and stopped there ('next milestone push publishes to origin'), so every generated phase workflow bolted a Sync box on right after Advance whose entire job was one `git push origin main`. Only a prompt-following caller got it: a human running advance-phase by hand, a session resumed after a crash, or CI left the handover commit stranded on local with nothing queued to publish it. Same shape Round 22 站2 relocated for manifest integrity. The failure-handling half is the subtle part — the commit-failure branch directly above rolls the advance back (B1 split-brain fix, because nothing landed in git at all), and copying that reflex to a push failure would destroy durable work to recover from a transient network error"
  fixed_in: "Round 23 站1 (opt-in `--push`, default OFF so the 8 generated workflows keep their Sync box and their bytes; the push runs after the existing refresh_attestation ritual cmd_advance_phase was already registered for in test_push_path_symmetry.py, so no second asymmetric path opens. Push failure returns the new exit 28 with the exact retry command in its [BLOCKED] message and does NOT roll back. Counterexample-verified: neutralising the push call turns both behaviour guards red)"

- test: tests/test_workflow_sim.py::test_sim_testbed_passes
  bug: "eight-bodies-in-one-file drift risk (Round 23 站2; guarded scenarios are sim_runner.test.mjs sections 11-12, floor raised 51 -> 63). run-all.js covers Phases 1-8 in a single workflow by inlining the eight generated phase bodies. Nothing about that construction is self-enforcing: a wrapper that silently dropped, reordered, or duplicated a dispatch would still produce a file that parses, runs, and returns a plausible object. The subtraction it carries is equally silent — six phases fold their Sync box into `advance-phase --push`, and folding a seventh (phase3's bespoke retry/MANUAL_REQUIRED Sync, or phase8's, which additionally verifies the release tag reached origin) would remove behaviour with every other test still green"
  fixed_in: "Round 23 站2/站3 (one scenario per phase asserts run-all's P<N> dispatch sequence equals what the standalone phaseN file produces, and a two-way exact-difference test pins the ONLY permitted divergence: minus six `sync` labels, plus one `phase-cursor`. Further scenarios cover the state.json cursor, the fail-closed branch when it cannot be read, and the past-Phase-8 no-op. HONEST BOUNDARY recorded in the test file and docs/PROPOSAL_ADJUDICATIONS.md R23: this pins the dispatch sequence, NOT byte-identical final artifacts. Counterexamples: adding phase8 to the fold list raises at generation time; dropping --push from phase5 turns the sim red)"

- test: tests/test_workflow_js_conventions.py::test_node_check_wrapper_actually_rejects_broken_syntax
  bug: "dead guard (Round 23 站2). test_node_check_syntax ran `node --check <path>` on each workflow file. A `.js` path with no package.json \"type\" is parsed as CommonJS, where the leading `export const meta` every workflow file starts with is a syntax error — and `node --check` returns 0 anyway. Verified against a file containing a deliberate unescaped apostrophe: exit 0, no diagnostic. The check could therefore never fail for any of the 8 files it was parametrized over, in the round that introduced it or since"
  fixed_in: "Round 23 站2 (the file is wrapped the way the RUNTIME evaluates it — top-level await and top-level return, i.e. a function body, exactly what sim_runner.mjs reproduces — before node --check runs, and this negative control pins that the wrapper is what makes the check real. It caught run-all's own first draft, whose meta.description contained \"state.json's\")"

- test: tests/test_workflow_js_conventions.py::TestScannerHandlesRegexLiterals::test_quote_inside_a_regex_does_not_open_a_string
  bug: "scanner desync on regex literals (Round 23 站3). scripts/workflow_audit/js_lint.py's comment/string scanner knew about `//`, `/* */` and the three quote characters, but not about REGEX LITERALS — whose bodies may legally contain a quote. The A/B machine's `approvalPayload.replace(/'/g, \"'\\\\''\")` therefore left the scanner believing an apostrophe had opened a string, and every construct after it was misclassified until the quote count happened to re-balance. Across the eight per-phase files it re-balanced by luck, so their lint verdicts were correct by accident; in run-all.js, where eight bodies follow one another, it did not, and `os.path.getsize` embedded in a bash command string surfaced as a live `path.*` violation. This is worse than a false positive: comment_line_numbers DELETES the lines it classifies, so a desynced scanner could drop a prompt line containing `https://` as though it were a comment"
  fixed_in: "Round 23 站3 (_segments gained a regex-literal branch guarded by the standard previous-significant-character heuristic, with character-class awareness so `/[/]/` terminates correctly. Four sibling tests pin url-in-string, division-is-still-division, block comments, and `//` text inside a template literal. The observed desync happened to run in the SAFE direction — it left 233 comment lines unstripped rather than deleting code, visible as run-all 316,561 -> 302,392 bytes after the fix with all eight phase files byte-identical. Counterexample-verified: reverting the branch turns both this test and the run-all banned-construct lint red)"

- test: tests/test_workflow_js_conventions.py::test_runall_stays_within_its_headroom_ratchet
  bug: "512 KB cliff with no warning track (Round 23 站2). Playbook §4: a workflow file over 524288 bytes is REFUSED by the runtime at parse time — not degraded, not warned about. run-all.js inlines all eight phase bodies, so it absorbs eight files' worth of prompt growth at eight times the rate of any single phase file, and verbatim inlining already reached ~410 KB (78% of the cap) before comment stripping. The existing test_under_512kb_hard_cap only fires at the cliff edge, by which point the fix is a large one under time pressure"
  fixed_in: "Round 23 站2 (RUNALL_MAX_BYTES headroom ratchet sized to the initial 316,547 bytes + 7%, with the policy stated in-file: hitting it means shortening prompts in scripts/workflowgen/, not raising the number. docs/PROPOSAL_ADJUDICATIONS.md R23-C records the re-open condition — two consecutive rounds that can only pass by raising it means the one-file-eight-phases shape itself needs re-evaluating)"


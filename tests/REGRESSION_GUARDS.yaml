- test: tests/test_da_waiver.py::TestAgainstRealTaskqGateResult::test_taskq_waiver_is_rejected_once_the_framework_score_is_used
  bug: "verdict-decided-before-the-truth-exists class (Round 21 站1). _collect_da_waivers answered 'is this waiver needed?' at gate-prerequisite time (cli/gate_cmds.py:1805), while the framework's own independent CRG pass — the thing that actually scores the one waivable dimension — does not run until finalize_gate (harness_bridge.py:2271). So the check could only read the agent's breakdown, where `architecture` is JSON null by construction: the agent does not score a CRG-only dimension. The safeguard was dead in both directions and never once fired: before Round 30 it read `tool_score` (never a real field) giving `0.0 >= inf`; Round 30 replaced that with `target` (also never a real field — it comes from harness/ssi/scripts/score.py, which writes .sessi-work/round_N/ output, NOT gate{N}_result.json) giving `score >= inf`. Same false, opposite reason. The schema, every real gate result, harness_bridge.py:2235 and gate_cmds.py:1698 itself all say `threshold`. Round 30's regression test passed because its fixture was hand-built from score.py's shape — rule and fixture from one head, the R19 站1 pattern's fifth appearance. taskq's P6 is the live consequence: a waiver was granted on the stated premise that CRG scores its hub-and-spoke layout 0, when crg_baseline_p6.json for that same commit records 100.0 (6/6 healthy communities), and da_waiver_needs_human_review was raised over a waiver nobody needed. The same line also crashes — float(_bd.get('score', 0.0)) on an explicit null, the exact trap harness_bridge.py:2235's comment warns about"
  fixed_in: "Round 21 站1 (core/quality_gate/da_waiver.adjudicate_waivers, called from finalize_gate after the CRG override, against result.dimensions and the gate-config thresholds; _collect_da_waivers keeps only what agent-authored input can decide — permission and evidence. An unscored dimension BLOCKs instead of waiving an unknown. Fixtures read a verbatim copy of taskq's committed gate4_result.json)"

- test: tests/cli/test_gate_cmds_cli.py::TestGate4DaWaiverCollection::test_waiver_for_non_crg_dimension_is_blocked
  bug: "unbounded-waiver-scope class (Round 21 站1). Neither _collect_da_waivers nor harness_bridge.py:2488's `dataclasses.replace(d, threshold=0.0) if d.name in da_waivers` restricted WHICH dimension a Devil's Advocate waiver could target, so two paragraphs of >=120 characters — the only check on the evidence — zeroed the threshold of any dimension, security and secrets_scanning included. evaluate_dimension.md:468-471 states NFR-backed dimension thresholds are 'raised, never lowered, not waivable' and core/quality_gate/sab_parser.py:150 repeats it, but no code enforced either sentence: another instance of the prompt-gate drift mother-defect (R17). taskq's SAB maps four NFR-backed dimensions (security 80, error_handling 80, readability 80, performance 75), three of which are Tier-3 DA dimensions whose evidence is already written every round — only a `da_waiver` key away. The waiver's sole documented rationale is CRG's Leiden community detection misreading an intentional hub-and-spoke layout, which applies to CRG-scored dimensions only"
  fixed_in: "Round 21 站1 (WAIVABLE_DIMENSIONS defined as CRG_ONLY_DIMENSIONS in core/quality_gate/da_waiver.py — one definition for both the permission check and the CRG override path, with a parity test pinning the two together; a request for any other dimension BLOCKs with remediation. Counterexample-verified: widening the set turns 4 tests red)"

- test: tests/test_gate_result_schema.py::TestSchemaMatchesReality::test_a_real_gate_result_validates
  bug: "schema-nobody-loads class (Round 21 站2). harness/ssi/schemas/harness_gate_result.schema.json shipped with the gate result format and was read by zero code paths — core/review_schema_validator.py validates b_review.schema.json and nothing else did the same for gate results. Unexecuted, it drifted into describing a document no run produces: it required a per-dimension `passed` no writer emits, typed `score` as a number while CRG-only dimensions carry null, required non-null `overall_score`/`meets_target` that real agents leave null because finalize-gate recomputes them, and omitted the four fields (tool_output/tool_evidence/issues/findings) every real breakdown entry carries. The only test guarding it re-stated the schema's own required list, so it could prove the file had not been edited and nothing more. With no enforced contract each consumer guessed the field names — which is exactly how the DA-waiver safeguard came to read `tool_score`, then `target`, neither of which any writer has ever produced, and stayed dead through two fixes. Fixing this also exposed two test fixtures that called themselves valid gate results while missing required fields, and one whose `dimensions` map of bare numbers was a shape harness_bridge's own dims builder (which reads `breakdown`) would have scored as no evidence at all"
  fixed_in: "Round 21 站2 (schema rewritten to describe what runs actually produce; core/quality_gate/gate_result_schema.py validates at the head of finalize_gate — the read that drives scoring — and BLOCKs with the offending paths named. The parity class reads a verbatim copy of taskq's committed gate4_result.json, an artifact this repo did not author, so the schema cannot agree only with fixtures written beside it. Counterexample-verified: restoring either pre-Round-21 claim turns 4 tests red)"

- test: tests/test_spawn_log_not_evidence.py::TestSpawnLogIsNotScored::test_a_fully_forged_log_scores_the_same_as_no_log_at_all
  bug: "audit-trail-written-by-the-audited class (Round 21 站3). PhaseTruthVerifier scored sessions_spawn.log at weight 0.20 (0.10 for phases 3-4) against a 90.0 threshold. That file is written by the agent whose work the score judges, it is gitignored so neither review nor CI ever sees it, and appending a line costs one Bash call — so every signal it carried was one the audited party could author. Three sources disagreed and nobody noticed the check was still live: SKILL.md:317 recorded HR-10 as REMOVED with the reason 'log is agent-writable, not tamper-evident', SAD.md:225 still listed HR-10 as MUST, and the code kept scoring it on both the finalize-gate and advance-phase paths. taskq's Phase 6 then carried six hand-written entries — session_id values like 'round3-da-architect-fr01' instead of UUIDs, no dispatch envelope, duration_seconds 0, whole-second timestamps one apart, the task field holding a conclusion rather than a prompt — with role=architect and phase=6 matching exactly what the A/B branch searched for, written 45 seconds before the first release(P6): Gate4 PASS commit. That branch had a second defect of its own: it collected reviewer roles across the WHOLE log with no phase filter, so one entry from any phase satisfied phases 1, 2 and 6 alike"
  fixed_in: "Round 21 站3 (check_session_log left verify()'s weighted list; weights redistributed to framework-block + previous-phase artifacts, which sum to 1.0; the A/B branch removed with it. The method survives as a diagnostic and core/doctor.py gained an authenticity heuristic — deliberately WARN-only and deliberately never scored, since a forger able to write the entries can write whatever that heuristic reads. SAD.md's two contradicting claims corrected. Counterexample-verified: adding the check back to any phase's list turns the parametrised guard red)"

- test: tests/test_workflow_sim.py::test_sim_testbed_passes
  bug: "FR-invariant work billed per FR (Round 22 站1; the guarded scenarios are sim_runner.test.mjs section 8, 'ORCH-POST dispatches once per phase, not once per FR' and 'total dispatch count does not grow with the FR count', floor raised 33 -> 41). js_blocks.render_per_fr_delta rendered ORCH-POST inside BOTH FR loops, so each FR bought a full sub-agent dispatch for two commands — and the second, `amend-sab`, accepts no --fr-id at all (cli/project_cmds.py::cmd_amend_sab) and is idempotent by construction (core/quality_gate/sab_amender.amend_sab: 'running twice adds nothing on the second call'), so every call after the first re-asked the same project-wide question. Measured on this testbed before the fix: P4 cost 21 dispatches at 5 FRs and 36 at 20; P5/P7/P8 18 and 33 — exactly one extra dispatch per extra FR, making ORCH-POST 80 of the ~203 dispatches a 20-FR P3-P8 run spends. taskq, a 5-FR project, left 35 `tool:amend-sab` rows in sessions_spawn.log. Nothing detected it: the step is fire-and-report with no verdict gate, so a wasted dispatch produced no failing signal, and every pre-Round-22 sim scenario ran a single FR, where per-FR and per-phase cost the same"
  fixed_in: "Round 22 站1 (one ORCH-POST dispatch per phase, after the FR loop; the per-FR information is preserved by a bash loop over gate1Pass inside that single agent, so spec-coverage-check still runs once per FR. plangen's blocks.py/phase_tasks.py moved in the same commit via _orch_post_once_step() so plan and JS cannot drift. P3 deliberately keeps its per-FR amend-sab — it runs before that FR's own GATE1 so the Architecture Amendment Protocol sees the module the FR just wrote. Counterexample-verified: re-injecting the per-FR dispatch turns the phase7 count test red)"

- test: tests/test_workflowgen.py::TestOrchPostIsPerPhaseNotPerFr::test_spec_coverage_still_runs_per_fr
  bug: "collapse-the-dispatch-collapse-the-check risk (Round 22 站1). Moving ORCH-POST out of the FR loop is only safe while the per-FR command inside it still runs once per FR, and nothing structural enforces that any more — the iteration now lives in prompt text (`for FR in ' + gate1Pass.join(' ') + '; do ... --fr-id $FR || true; done`). A later edit could quietly drop it and leave a single project-wide spec-coverage-check reporting an average instead of per-FR early warnings, with the dispatch count unchanged and every other guard, including the sim count tests, still green"
  fixed_in: "Round 22 站1 (this test pins the bash loop and the $FR substitution in the generated output of all four FR-loop phases; its sibling test_amend_sab_appears_once_per_generated_workflow pins amend-sab to exactly one mention per workflow)"

- test: tests/test_handover_generator.py::TestCmdAdvancePhase::test_corrupt_manifest_blocks_advance_with_recovery_command
  bug: "check-only-on-one-caller's-path class (Round 22 站2). quality_manifest.json integrity was verified exclusively from workflow JS — an entry-point phase() box plus one sub-agent dispatch per Advance round, each shelling out to `check-manifest-integrity`, itself a thin wrapper around PhaseHooks.preflight_manifest_integrity(). advance-phase, which COMMITS .methodology/ wholesale, never ran it: _advance_prechecks had no such step. So every non-workflow caller — a human running advance-phase by hand, a session resumed after a crash, CI — could bake a truncated fr_ids / cleared traceability / wiped gate1 straight into git history, which is exactly what commit 3198402 did once. tests/test_workflow_plan_alignment.py's own registry stated the hole in prose ('A human running the plan by hand has no equivalent step') and filed it as a justified runtime-only invention rather than a gap. The entry-point call was separately redundant: Entry & Preflight runs `run-phase --phase N` in the box immediately before it, and PREFLIGHT_CHECKS[0] IS preflight_manifest_integrity"
  fixed_in: "Round 22 站2 (cli/phase_cmds.py::_advance_prechecks runs it first — before every other precheck, since they all read the manifest — returning the new exit 27 with the restore command in its [BLOCKED] message. Both advance-phase entry paths, normal and re-verify, go through _advance_prechecks. The entry-point and Advance-loop dispatches were removed from all six workflows; the helper survives only where advance-phase does not cover the call site — phase3's Gate-2 round loop and phase8's Final Push. Counterexample-verified: neutralising the CLI check drops the exit code back to 8)"

- test: tests/test_workflow_sim.py::test_sim_testbed_passes
  bug: "relocation-leaves-a-duplicate risk (Round 22 站2; guarded scenarios are sim_runner.test.mjs section 9, floor raised 41 -> 48). Once advance-phase enforces manifest integrity itself, any surviving workflow-side dispatch for the same check is pure cost — but nothing structural prevents one being re-added, and re-adding it produces no failing signal on its own (the check would simply run twice and pass twice). The inverse risk is equally silent: deleting the two call sites advance-phase does NOT cover (phase3's Gate-2 round loop, where a mid-loop fix attempt can reintroduce corruption before finalize-gate commits, and phase8's Final Push, which is push-milestone rather than advance-phase) would leave those two paths unguarded with every test still green"
  fixed_in: "Round 22 站2 (one scenario asserts the exact per-file set of surviving integrity dispatches — phase8 only — and that neither the entry-point label nor advance-integrity-r* reappears anywhere; a second drives phase3 into its Gate-2 round loop and requires the per-round check to fire there. Counterexample-verified: re-injecting the Advance-loop dispatch names phase7 in the first scenario's failure)"

- test: tests/test_workflow_sim.py::test_sim_testbed_passes
  bug: "probe-checks-what-the-next-command-checks class (Round 22 站3; guarded scenarios are sim_runner.test.mjs section 10, floor raised 48 -> 51). Every FR-loop phase spent a `ctx-check-N` sub-agent dispatch running `json.load(ctxFile)` to prove the ctx file was parseable, immediately before a `load-ctx-aN` dispatch whose own command also runs `json.load(ctxFile)` and exits nonzero on exactly the same inputs — the probe's failure set is a strict subset of the read's. The two outcomes it distinguished (file missing vs. file unparseable) had identical handling: regenerate. On phase3 it was worse than redundant: Fix D (2026-07-18) forces a fresh load-context on attempt 1 via `attempt === 1 || !(existsVerdict…)`, which short-circuits before the verdict is read, so on the attempt that matters the probe ran, answered, and was discarded outright. This is the same shape as Round 20's meta-pattern — several layers interrogating one source — costing one dispatch per phase, five phases per run"
  fixed_in: "Round 22 站3 (the read is the check: a failed load-ctx now routes to the same regeneration path the probe used to trigger, and phase3 keeps Fix D by making attempt 1 regenerate unconditionally before reading. Three scenarios pin it: one dispatch on a clean read, phase3's forced attempt-1 regen, and recovery-after-regen on a failed read. Counterexample-verified: removing the regen leg turns the third red)"

- test: tests/test_workflowgen.py::TestPollBackoff::test_env_check_poll_starts_short_and_backs_off
  bug: "poll interval sized for the worst case, paid in the common case (Round 22 站4). Both background-poll prompts opened with a flat sleep matched to their slowest possible run: 60s for env-check, 30s per FR for the GATE1-DELTA fast-path probe. Round 20 站1 then made run-env-check return in about a second whenever env_contract.json is current (source docs unchanged -> deterministic verification, no sub-agent spawned, cli/gate_cmds.py), and an unchanged FR hits GATE1-DELTA's in-CLI short-circuit just as fast — but the prompts never moved, so every phase slept a full minute on a finished command, and the per-FR probe, which walks FRs one at a time, slept 30s x N (about ten minutes on a 20-FR project). Pure wall-clock, invisible to every correctness check: the run still passed, just later"
  fixed_in: "Round 22 站4 (backoff sequences — env-check 5/10/20/30 then 60s capped at 22 polls ~19min; fast-path probe 5/10 then 30s capped at 42 polls ~20min — so the total tolerance for a genuinely long run is unchanged. The full per-FR loop keeps its flat 30s/cap-60: that path can chain an entire TDD cycle and a short first sleep buys nothing there, pinned by test_the_full_per_fr_loop_keeps_its_flat_interval. The authoritative signals are unchanged — `kill -0` DONE and the final RC= line, never the log contents)"

- test: tests/test_no_hardcoded_paths.py::test_shipped_surfaces_carry_no_foreign_project_tokens
  bug: "generated-artifact outside the shipped-surface list (Round 20 站4, the fourth recurrence of the cross-project pollution class Round 8 站3 addressed). Round 23 (e2b98b6) landed a comment naming a downstream project and one of its workflow run ids into five .claude/workflows/*.js files. The generator's own text had since been de-identified, but the artifacts were never regenerated, so the leak lived only in the committed output — where the guard did not look, because _SHIPPED_SURFACE_DIRS covered templates/ + harness/prompts + harness/ssi/prompts and not generated workflow JS, which every project's orchestrator agent reads. The same drift also meant generate_workflows.py --check had been reporting 5/8 DRIFT since e2b98b6 (8/8 at 4aa6ff2 and at cdc6fe1, so not introduced by Round 20); the two commits after it did not run --check"

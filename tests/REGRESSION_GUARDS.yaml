  bug: "cost-blind-on-failure class (Round 19 站2): 50 of 50 successful taskq dispatches logged a cost figure; 2 of 19 failures did, while those failures burned 1.30h of the run's 3.75h. Every run-report cost number was the cost of the happy path. Not a data problem — spawn()'s non-zero-exit branch already json.loads() its stdout via _extract_dispatch_error (taskq's error_output 'subtype=success API Error: Stream idle timeout' is that function's own output, both substrings lifted from a parsed envelope), and total_cost_usd/num_turns/usage sat in the same dict while _extract_envelope_metrics was only ever called on the returncode == 0 path. Worse, a test had frozen the gap into a spec: test_spawn_envelope_absent_on_error_path asserted a non-zero exit 'never produced an envelope ... regardless of what the (unused) stdout happens to contain' — describing our code, not the CLI. Same closed-loop shape as 站1"

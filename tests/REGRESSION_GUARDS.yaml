- test: tests/test_failure_corpus_coverage.py::test_real_failure_shapes_are_classified
  bug: "classifier-blind-to-production class (Round 19 站1): _INFRA_ERROR_RE carried 'stream closed' and 'rate limit' but not the sibling phrasings the CLI actually emits — 12 'API Error: Stream idle timeout - no chunks received' and 1 'You've hit your session limit' all classified EXECUTION_ERROR, i.e. 'the agent's own logic failed', which routes into CODE-FIX. Widening the regex alone was not enough and that is the deeper lesson: those entries STILL read UNCLASSIFIED afterwards, because each carried error_class='EXECUTION_ERROR' stamped at dispatch time. _effective_error_class now re-derives that one value (it is _classify_dispatch_error's else branch — an absence of a finding under the registry as it stood that day, not a positive verdict), which is the only way a signature fix can reach data already on disk, and is what makes the corpus an end-to-end test rather than a verdict replay. Ratchet starts at 0: 5 of the 9 exported shapes were UNCLASSIFIED before this station"

# =============================================================================
# Regression-guard registry
# =============================================================================
# Each entry pins a test that guards a previously fixed bug. Deleting or
# renaming any test listed here MUST be accompanied, in the same commit, by
# an update to this file explaining why the guard is no longer needed —
# scripts/verify_regression_guards.py blocks pre-push and CI otherwise, and
# tests/test_verify_regression_guards.py fails in any plain pytest run.
#
# Why this exists: the sqlite-swallow fix (ff98cc7) was silently reverted AND
# its guard test deleted in the same span; nothing caught it until a manual
# review (re-fixed in 7247c5d). 667 test functions have been deleted across
# this repo's history with zero detection.
#
# Entry fields:
#   test:     exact pytest node id (parametrized guards: bare id without [..])
#   bug:      what regression this test pins (shown when the guard goes missing)
#   fixed_in: commit(s) that fixed the bug
# =============================================================================


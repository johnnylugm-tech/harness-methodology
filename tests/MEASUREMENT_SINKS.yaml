# MEASUREMENT_SINKS — where each thing the framework measures ends up.
#
# Round 67 站8. Five of this round's eight defects were the same shape: the
# framework computed the true thing and nothing read it.
#
#   score_source          computed, published in measurement_scope, invisible
#                         to the verdict and absent from the committed file
#   contract_coverage_gap computed since Round 46, one caller, wrote a log row
#   uncovered modules     130 ledger rows in taskq-cc while lint-imports
#                         reported the contract kept
#   submodule pin CI      answerable by a function that already existed
#   the pre-push list     enforced only after the push
#
# Each was fixed in its own station. This file is for the next one: a
# measurement may be report-only, but "nobody decided" stops being an
# available state. Every `record_degradation` component in the tree appears
# here with one of three sinks.
#
#   verdict      something refuses to proceed on this — name it in `where`
#   report-only  deliberately recorded and not enforced — `why` is required,
#                and "we have not got round to it" is not a why
#   unreviewed   nobody has read this site and asked the question
#
# `unreviewed` is a real answer and stays available, for the reason Round 50
# 站4 kept `unknown` as an owner: the alternative is a guess wearing a
# decision's clothes. What it does not get is permanence — the count only
# ratchets down (tests/test_measurement_sinks.py), so a round that touches
# one of these sites has to answer for it, and a NEW producer cannot be
# added as unreviewed at all.
#
# Keys are the component string. A component built from an f-string is keyed
# by its literal prefix plus `*` (all nine such sites in the tree have one;
# a producer whose component has no literal prefix fails the guard, because
# a sink nobody can name is a sink nobody can check).

sinks:
  # ── verdict ────────────────────────────────────────────────────────────
  "gate:stubbed-boundary":
    sink: verdict
    where: >-
      harness_bridge.finalize_gate raises GateBlockedError
      (dimension_not_measured) when a suite-measured dimension carries
      score_source=stubbed_boundary. Round 67 站2.
  "gate:arch-constraints":
    sink: verdict
    where: >-
      Two raises in finalize_gate — arch_constraint_unconfigured (Round 54)
      for a constraint whose executor this project has not configured, and
      arch_contract_coverage (Round 67 站7) for delivered modules no contract
      reaches. The declared_only rows in the same component are report-only
      by adjudication R54; see docs/PROPOSAL_ADJUDICATIONS.md.
  "spec-coverage:unreadable-declaration":
    sink: verdict
    where: >-
      spec_coverage._run_spec_coverage_check returns (1, 0.0) when a row
      inside a declaration table names a `test_`-prefixed identifier the
      parser could not resolve. Round 99 站2. This is the other half of
      spec-coverage:unread-row's population, split off by asking whether the
      row names a test: that entry stays report-only because taskq-advance's
      `(cross-cutting tooling)` and taskq-cc's `(none declared for this
      round)` are a project stating the truth in the only column it has, and
      those rows name no test. Measured over the 13 corpus TEST_SPEC.md
      files: advance 2 unread / 0 naming a test, cc 1 / 0, taskq-done
      109 / 108, ten others 0 / 0. The check runs ahead of the P1 Naming
      Authority block, which on taskq-done reported 91 of 91 inventory names
      "missing in TEST_SPEC.md — Agent A may have hallucinated names" about
      names present in exactly those rows.
  "sab:unplaceable-module":
    sink: verdict
    where: >-
      cli/gate_cmds.py::_check_sab_module_alignment returns 1 when a delivered
      module is in no SAB layer and amend-sab did not close the gap, which
      from Round 101 is what happens whenever the module's own name states no
      declared layer. amend_sab used to file those under `layers[-1]` instead:
      measured over the seventeen corpus projects, 84 of 478 placements came
      from that rule, and on taskq-done `taskq_api` and `taskq_api.errors`
      landing in `models` produced 7 of the 11 CRITICAL architecture
      violations its P3 exit reported. The ledger row is written at the
      refusal so the list survives the terminal it was printed to; the block
      itself is the pre-existing Gate 1 branch, not a new stop.
  "gate:ac-deferred":
    sink: report-only
    why: >-
      Round 69 站5. A criterion deferred to a named tool is not a criterion
      that was tested, and it is not a criterion that was dropped either. The
      `ac_deferred` finding is `info` so it does not block — an NFR verified
      by pip-licenses or import-linter genuinely has no request/response case,
      and before Step 1d there was no legal way to say so. This row is what
      stops "no legal way" from becoming "free": it names every deferred id,
      owner=project.
    reopen_when: >-
      the framework can confirm that a verifier named in a `Deferred:` line
      exists and ran. Nothing does that today, so a deferral is a promise this
      round records and cannot check. The rows are the evidence a later round
      reads to find out which tool names are real.
  "gate:required-artifacts":
    sink: verdict
    where: >-
      required_artifacts_blocking_reason, raised in finalize_gate as
      required_artifact_missing. Round 68 站1. Both statuses block — a declared
      path that is absent and one that ships somewhere else are the same
      defect stated twice. The second row this component writes, for a project
      that declares nothing at all, is deliberately NOT a verdict: this
      station checks declarations, it does not invent them, and Round 57's
      "who declares the scope" is not solved here.
  "gate:verify-target":
    sink: verdict
    where: >-
      verify_target.blocking_reason, raised in finalize_gate. Round 52 站1.
  "gate:verify-system-reach":
    sink: verdict
    where: >-
      _verify_system_reach_block in finalize_gate. Round 52 站2.
  "milestone:uncommitted":
    sink: verdict
    where: >-
      cli/phase_cmds.py returns EX_ADVANCE_UNCOMMITTED_DELIVERABLES on the
      same path that writes these rows.
  "obligation:*":
    sink: verdict
    where: >-
      cli/phase_cmds.py returns EX_ADVANCE_ENTRY_OBLIGATIONS on the same
      path. These are the 460 rows in taskq-cc's ledger that really did stop
      P3 entry — the mechanism working, recorded here so it is not mistaken
      for the ones that did not.

  # ── report-only ────────────────────────────────────────────────────────
  "gate:dimension-never-measured":
    sink: report-only
    why: >-
      Round 73 站5 wrote this as `gate:dimension-declared-absent`, asking
      whether a declared dimension was in THIS gate. Its own reopen condition
      was "a dimension NOTHING else judges — a requirement with no executor at
      all rather than one judged elsewhere", and Round 83 站5 is that reopen:
      the row now fires only when no gate config anywhere contains the
      dimension. The per-gate question could never produce a true finding —
      measured over the eleven projects here, the union of the four gate
      configs is 18 names, the python registry is 16, and `registry - union`
      is empty, so every row it emitted was the framework's own gate layering
      filed as a harness fault (taskq-cc-new: 79 rows, 66 of them at Gate 1,
      which has four dimensions by design; zero real findings). Zero rows
      across the corpus under the new question, which is the point — a channel
      with no false positives is one whose first row will be read. Still
      report-only rather than blocking: which dimensions a gate runs is a
      framework decision, so this names the framework's own gap, and
      `raw["measurement_scope"]["dimensions_declared_absent"]` keeps the
      per-gate list Round 73 站5 built (a true statement about the average the
      reader is looking at). Reopen if a project ships with a non-empty row —
      that is a requirement this pipeline cannot score at all.

  "gate:tests-failed-declared":
    sink: report-only
    why: >-
      Round 77 站5. `tests_failed` has been REQUIRED in the GATE1 prompt since
      it was written and nothing in the tree read it — one grep, zero
      production readers — so the number a project was made to declare was
      never honoured or contradicted. The framework now writes its own count
      into the committed result (the same rule `s4_score_verdict` applies to
      `score`: the framework ran the tool, so the framework's number is the
      one that ships), and this row is what a disagreement leaves behind.
      Deliberately not a block: every case where an under-report hides a real
      failure is already blocked by S4-B's own verdict, so a block here could
      only catch an OVER-report — an agent pasting the whole suite's summary
      count, which is exactly what the prompt asked for until Round 77 站3
      removed the ambiguity, and charging a project for obeying yesterday's
      instruction is Round 42's defect. Where the framework cannot measure at
      all (a JS runner, or output it could not reconcile) the field IS read as
      a verdict — `_check_tests_failed` blocks on a self-declared non-zero,
      because an admission needs no cross-check.
    reopen_when: >-
      these rows keep appearing for Python FRs after a few rounds with the
      Round 77 站3 prompt in place. That would mean the single rule the prompt
      now states is not the one agents follow, and the field should either
      block or stop being called REQUIRED — a field that is neither read nor
      honoured is a declaration the project pays to write.

  "gate:out-of-scope-test-failures":
    sink: report-only
    why: >-
      Round 77 站2. A per-FR Gate 1 answers for its own FR: blocking FR-08
      because FR-01's test is red asks it to fix code the run's own SCOPE
      RULES forbid it to touch (Round 42), so these do not block. What this
      row replaces is a promise that was not true — Round 76 printed
      "owning FRs' gates will catch" and returned, while the FR loop is
      forward-only (`for (const frId of frIds)` with an `alreadyDone` skip)
      and S4-B runs only at `gate_num == 1`, so an FR already behind never
      re-runs, and a failing test in a file no FR owns has no owning gate at
      all. The executor is `cli/phase_cmds.py::_advance_prechecks`, which
      runs the whole suite at every phase transition and refuses to advance
      while any test is red; this row is what makes the failure attributable
      when it gets there, instead of an un-owned "[BLOCKED] TDD
      test/coverage failure" one phase later.
    reopen_when: >-
      `_advance_prechecks` stops being the executor for a project — it is
      guarded by `src_dir.is_dir()` and `_suite.ran`, so a non-Python project
      or one whose suite `run_suite` declines to measure has nothing behind
      this waiver and these rows are the only record. The same applies to
      JS/TS at this gate for a different reason: `_scoped_test_failures`
      returns None for vitest/jest, so those projects never reach this row
      and keep the whole-run rule, which is Round 76's original defect left
      standing for them deliberately (a JS run is not per-FR scoped, so
      blocking on the framework's own copy of it would be strictly worse).

  "spec-coverage:unread-row":
    sink: report-only
    why: >-
      Round 74 站2. A TEST_SPEC row sitting inside a declaration table and
      naming no test function is not in the spec-coverage denominator, and
      until now it left no trace of having been skipped. Not a verdict, and
      the why is not deferral: taskq-advance writes `(cross-cutting tooling)`
      for the two NFRs whose verifiers are pip-licenses and mutmut, and
      taskq-cc writes `(none declared for this round — single-version
      service)`, both of which are a project stating the truth in the only
      column it has. Blocking those would charge a project for obeying the
      substance (Round 42). What the row buys is that a reader can tell them
      apart from a parser that stopped reading: measured with Round 73's
      header rule still in place, this same signal reports 81 rows across six
      projects, 25 of them taskq-new's, starting at the row that swallowed
      the rest of its table — the loss Round 74 站1 fixes.
    reopen_when: >-
      a project's unread rows carry an identifier-shaped name the parser
      declined for a reason other than "this row declares no test" — that
      would be the parser losing declarations again rather than the project
      declining to make one, and it is decidable from the row text this
      component already records.

  "spec-coverage:naming-authority":
    sink: report-only
    why: >-
      Round 111 站F1. The P1 Naming Authority check reads the working-tree
      TEST_INVENTORY.yaml, so a declaration that shrinks satisfies it, and
      `state.json.test_inventory_checksum` — written at the P1 exit since
      v2.6.1 for exactly this comparison — had one writer and zero readers.
      Not a verdict, and the why is not deferral: the first version of this
      fix DID block on shrinkage, and checked against the only corpus project
      whose declaration shrinks it was a false accusation. taskq-new's 50
      retracted names include
      test_fr10_ac5_status_mapping_422_401_403_404_409_429_503_500, which its
      TEST_SPEC.md carries as eight separate rows, and
      test_fr02_ac3_state_machine_done_failed_timeout split in two. Splitting
      one declaration into the tests it always meant is refinement, and
      charging the one project that refined its declaration is Round 46.
      Measured 2026-09-09 across the 21 corpus projects: 11 have moved, 10
      purely by addition (the normal path — P2 derives test cases and the
      inventory grows, and every name in today's file is already compared
      against TEST_SPEC.md by the live check), so only taskq-new files a row.
    reopen_when: >-
      a retracted name is one TEST_SPEC.md never carried under any spelling —
      that is a declaration withdrawn rather than refined, and it is decidable
      from the two sets this component already records.

  "spec:undelivered":
    sink: report-only
    why: >-
      The threshold ladder (Gate 1 40, G2/G3/G4 60/80/90) already judges the
      ratio; _record_undelivered_tests' own docstring records the decision —
      replacing one stated number with a stricter stated number is not a fix.
      What the rows add is that a pass over the ladder no longer erases what
      it passed over. Reopen if a project ships a gate PASS with names on
      this list that were never delivered by Phase 8.

  "mutation:runner":
    sink: report-only
    why: >-
      Round 68 站2. `paths_to_mutate` is rendered from the SAB by
      _regenerate_mutmut_scope; `runner` — which tests may kill a mutant, and
      therefore what the score is — is hand-written and was read by nothing.
      Not a verdict, and the why is not deferral: a test that shells out to a
      nested pytest, or re-runs the whole suite through `make`, genuinely
      cannot be in the mutant-killing set, so narrowing is sometimes correct
      and a block on it would be satisfied by making the baseline unrunnable.
      Reopen if a project's recorded mutation score is traced to a `-k` that
      excluded tests which could have killed mutants inside paths_to_mutate —
      that is decidable by re-running the baseline without the filter, and it
      is the measurement this row exists to make possible.

  "state-io.sync_missing_fr_traceability":
    sink: report-only
    why: >-
      FR-99 Gate 1 fix. quality_manifest.json's fr_module_traceability is
      frozen at Phase-2 exit; SAB.json's copy is amended later in Phase 3
      for a framework-owned/placeholder FR whose module path is only
      decided post-P2 (e.g. FR-99). Every per-FR coverage-scope reader
      (_fr_module_paths, fr_coverage_record, _gate1_per_fr_coverage_verdict)
      reads only the manifest, so the FR's genuinely resolvable scope was
      reported as unresolvable and the FR silently scored against the whole
      project instead of its own module. This row records every backfill —
      not a verdict, because the backfill itself is what makes the FR's own
      Gate 1 test_coverage score correct; nothing needs to act on the row
      for the fix to take effect. Reopen if a project's backfilled entry
      ever disagrees with what a human later curates into SAD.md/SAB.json
      for that FR — this function never overwrites an existing manifest
      key, so that would mean the ADDITION itself, not a later edit, was
      wrong.

  "auto_fix":
    sink: report-only
    why: >-
      Round 108 站A. HR-14 ("Integrity < 40 → FREEZE",
      constitution/CONSTITUTION.md:251, SKILL.md:365) reads
      state.json["integrity"]. That key has one reader — the escalation branch
      that writes this row — and zero writers anywhere in the tree; measured
      2026-09-08, none of the fifteen corpus projects carries it. The reader
      used to default to 100.0, so HR-14 was answered against a fabricated
      perfect score on every project this framework has ever touched and
      looked, from the constitution, like a rule being honoured.
      report-only and not verdict on purpose: escalating on the absence would
      block all fifteen projects over a number the framework does not
      produce, which is the false accusation Round 46 named. So the row IS
      the sink — HR-14 stays visibly unanswered instead of invisibly passed
      (Round 32/35), owner=harness because the missing producer is the
      framework's debt. Reopen when anything writes an integrity score: then
      this stops firing and the verdict branch beside it takes over.

      Round 109 站5 met that re-open condition and this row is now the
      NARROWER of two paths, not the only one.
      `harness/harness_bridge.py::_record_integrity` writes
      state["integrity"] at every gate finalize — 100.0 or 0.0, projected
      from `PhaseHooks.manifest_integrity`, the one judgement this framework
      already owned under that name — so on a project whose gates have run,
      HR-14 is answered and the verdict branch beside this one fires. The row
      stays because the abstention is still reachable and still correct: no
      quality_manifest.json yet (the check measured nothing), no state.json,
      or an unreadable one. Those are could-not-measure, not a pass, which is
      the distinction this entry was written for. Reopen if a project that
      HAS finalized a gate still records this row — that would mean the
      producer did not reach the file the reader opens.

  # ── Round 109 站6: the four readers of quality_targets.min_coverage ────
  # `min_coverage_floor` used to answer the framework's own 80.0 when a
  # project declared no floor, so all four of these judged a project against
  # a number nobody in that project had written. Each now says so instead.
  # owner=project on all four: declaring a coverage target is the project's.

  "advance:gate1-coverage":
    sink: verdict
    where: >-
      cli/advance_checks.py::_check_gate1_live_coverage returns 14
      (EX_GATE1_LIVE_COVERAGE_FAIL) — advance-phase blocks. Placed
      immediately before the floor's only use, NOT after the manifest read:
      the DELTA auto-skip above returns before any comparison happens, and
      an earlier placement blocked projects over a number nothing was about
      to read (Round 46; tests/test_gate1_live_coverage.py caught it).
  "gate:coverage-floor":
    sink: verdict
    where: >-
      cli/gate_cmds.py's run-gate: `_non_code_coverage_instruction(None)`
      tells the agent to leave test_coverage UNSCORED and say why, and an
      unscored dimension is blocked by harness_bridge's
      _stage_absent_dimensions (Round 60). The alternative was the previous
      behaviour — handing the agent the framework's 80 to write back as a
      measured score.
  "fr-step-coverage-fix":
    sink: report-only
    why: >-
      cli/fr_cmds.py's COVERAGE-FIX branch. The row records that the agent's
      LOW_COVERAGE could not be overturned, and the run then takes the
      operator break it would have taken anyway — the guarded comparison
      cannot conclude "false positive" without a floor, so the fail-closed
      outcome is already the verdict. report-only because escalating here
      would double-report the break the branch already produces. Reopen if a
      project reaches this row and the run does NOT stop.
  "phase8-doc-gen":
    sink: report-only
    why: >-
      scripts/phase8_doc_gen.py renders a release document; it judges
      nothing and blocks nothing, by design (the Phase 8 reviewer reads its
      output). The row exists because the field it fills is SHIPPED: it used
      to print the framework's 80 as the project's coverage target, and a
      reader takes a number in a release document for the project's own. The
      document now says "(not declared)". Reopen if a released document is
      ever taken as evidence by a check rather than by a person.

  # ── unreviewed ─────────────────────────────────────────────────────────
  # Nobody has read these sites and asked whether anything acts on them.
  # Round 67 did not read them either, and says so rather than guessing.
  "advance-phase": {sink: unreviewed}
  "advance-phase:deliverable-anchors": {sink: unreviewed}
  "advance-phase:regen-view": {sink: unreviewed}
  "agent:*": {sink: unreviewed}
  "auto_fix.guardrails.rollback_if_unsafe": {sink: unreviewed}
  "ci:verdict": {sink: unreviewed}
  "crash-triage": {sink: unreviewed}
  "crg:baseline": {sink: unreviewed}
  "crg:graph-scope": {sink: unreviewed}
  "doctor:*": {sink: unreviewed}
  "doctor:unavailable": {sink: unreviewed}
  "drift_detector._load_sab_baseline": {sink: unreviewed}
  "finalize-gate": {sink: unreviewed}
  "fr-step-no-progress": {sink: unreviewed}
  "gate1_evidence.record_gate1_score": {sink: unreviewed}
  "gate:S6-exclusion-vcs": {sink: unreviewed}
  "gate:coverage-denominator":
    sink: report-only
    why: >-
      Round 96 read it because it is the largest producer in the corpus — 153
      of taskq-final's 428 rows, one per gate run, all identical, and its
      return value was discarded at the call site. Two things came of reading
      it. The `statements_omitted` field said `0` where the message said "size
      unknown" (coverage.json is written by a run that already applied the
      omit, so the omitted files are usually absent from it); it is `None`
      there now, because Round 35's rule is that a measurement which could not
      be taken is not a zero. And the denominator now travels into
      `breakdown.test_coverage.coverage_denominator`, so the percentage ships
      with what it was taken over (Round 42 站4). Report-only rather than a
      verdict: an omit is legal and taskq-advance's has a written rationale —
      what was missing was the number being visible beside the score, not
      permission to have one.
    reopen_when: >-
      a project's omit removes a share of the delivered tree large enough that
      the reported percentage and the whole-tree percentage would land on
      opposite sides of the threshold. That is now decidable from the field
      this round put beside the score — measured on taskq-api it was 63/839 =
      7.5 %, reported 100 % against at best 92.5 %, and nothing could see it.
  "gate:delivery-fingerprint": {sink: unreviewed}
  "gate:env-repair": {sink: unreviewed}
  "gate:evidence-not-persisted": {sink: unreviewed}
  "gate:evidence-too-large": {sink: unreviewed}
  "gate:s4:*": {sink: unreviewed}
  "gate:scan-scope": {sink: unreviewed}
  "gate:test-skips": {sink: unreviewed}
  "harness_bridge.generate_quality_manifest": {sink: unreviewed}
  "mutation:scope": {sink: unreviewed}
  "mutation:score-artifact": {sink: unreviewed}
  "phase_cmds._advance_fsm": {sink: unreviewed}
  "run-fr-step:*": {sink: unreviewed}
  "state-io": {sink: unreviewed}

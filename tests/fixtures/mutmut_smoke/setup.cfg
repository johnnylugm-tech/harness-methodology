# Standard target-project shape: relative [tool:pytest] paths that the
# mutation_enforcer must rewrite to absolute in its workdir copy (the
# historical #106/#106b bug path), and a [mutmut] runner it must rebase
# onto sys.executable (#91/#116).
[tool:pytest]
testpaths = 03-development/tests
pythonpath = 03-development/src

[mutmut]
paths_to_mutate = 03-development/src
tests_dir = 03-development/tests
runner = python -m pytest -x -q

# =============================================================================
# What already measures a deferred decision's re-open condition — hand-written.
# =============================================================================
# docs/deferred_index.yaml is a COPY of the ledger and nothing else. This file
# is the judgement that copy deliberately excludes: for a given "not doing"
# decision, which test would notice if its re-open condition came true, or —
# when it already has — which round acted on it.
#
# Round 81 站5. Round 80's cost is what this is for: three of that round's
# opening findings had been adjudicated by R74 站3 and R77 站4, and BOTH of
# those adjudications had left working guards behind
# (tests/test_test_spec_parser_parity.py, tests/test_fr_test_filename_parity.py,
# green the whole time). The ledger had the answers and the guards were running;
# nothing connected a proposal to either. An index alone would not have fixed
# that — this mapping is the part that would.
#
# NO LONGER SPARSE — Round 110 站3, by 老闆's ruling. It used to say
# "DELIBERATELY SPARSE: an entry is added only when someone has actually looked",
# with the repo-wide audit recorded as not-doing in Round 81. That audit is done:
# every one of the index's 288 recorded decisions now carries a verdict, and
# tests/test_deferred_index.py::test_every_recorded_decision_has_a_verdict holds
# the whole index as its denominator rather than the 106 table rows with a
# non-dash re-open cell that Round 109 站7 could address.
#
# THE COST, STATED IN THE OPEN: every 不做 decision the ledger gains from here —
# table row or bullet — needs a verdict row in the same commit, or that guard is
# red. That is the point; it is also work, and pretending otherwise is how the
# 181-row hole opened.
#
# WHAT AN ABSENT KEY MEANT BEFORE, kept because it is the reason this file
# exists: "nobody has checked" (Round 46), and — the thing Round 81 shipped and
# did not notice — "someone checked, wrote the answer in the ledger, and never
# brought it back here". The mega-function row below was missing from the first
# version of this file for exactly that reason.
#
# HOW THE 181 WERE CLASSIFIED. Every entry was read in full. 46 of the 136
# bullets and 5 of the two-column table rows state a re-open condition in prose
# (the two-column tables carry it inside the 理由 cell, so `reopen` being absent
# from the index is not the same as there being no condition); those got a
# measured verdict. The remaining 119 are scope, discretion, or a decision the
# ledger itself closes — NO_CONDITION, each one carrying the ledger's own reason
# as its basis, never blank. A keyword screen was tried first and got it wrong
# twice (`Re-open：` missed by a case-sensitive pattern, `若…重議` missed
# entirely), which is why the classification is a reading and not a regex.
#
# WHAT `MET` MEANS, AND WHAT IT DOES NOT (Round 110 站4). A re-open condition
# answers "has the obstacle gone?", NOT "should this be done?". Those are two
# questions, and the ledger only ever wrote the first one down. Seven rows now
# carry MET with nothing resolved: two are work a later round should schedule
# (R98, R99), and four are met-and-still-should-not-be-done — a project-side
# scope call (R86), a spelling SSOT that would be chosen from a sample of one
# and is therefore Round 87 (R83), a parser swap that changes the population
# rather than refining it (R105), and a check whose candidate fix would point it
# at a file the framework writes itself (R105).
#
# No field was added for this. A "should it still be done?" column would be a
# second declaration nobody executes — the shape this repo keeps closing (Round
# 30) — so it lives in each row's `note`, where it has to be argued rather than
# ticked. Round 105's own defer had two halves and the re-open condition
# recorded only the first; that is how a MET verdict comes to read like an
# instruction.
#
# KEYED BY (round, item), NOT BY LINE. The first draft keyed on the ledger line
# number, which every subsequent ledger edit invalidates — Round 81's own
# section, inserted above Round 80's, moved all eight of its rows. `item` is
# verbatim ledger text, so it is stable exactly as long as the decision is.
#
# Fields:
#   round        the ledger round the decision belongs to
#   item         the entry's first cell / first line, verbatim from the index
#   verdict      MET | NOT_MET | PREMISE_FALSE | ALREADY_DONE | NO_CONDITION
#   evidence     what was measured, dated, so the verdict can be re-checked
#   guard        pytest node id that measures the re-open condition, or `manual`
#                (ALREADY_DONE may not be `manual` — a claim that the work is
#                done has to name the test that proves it)
#   resolved_in  set when the condition has since been met and acted on
#   note         why this mapping is what it is
# =============================================================================


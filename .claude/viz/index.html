<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Harness Methodology — Phase-End Audit Map</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --surface2: #22263a;
    --border: #2e3350;
    --pass: #22c55e;
    --fail: #ef4444;
    --warn: #f59e0b;
    --info: #60a5fa;
    --crit: #f97316;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --gate1: #818cf8;
    --gate2: #34d399;
    --gate3: #fb923c;
    --gate4: #e879f9;
    --advance: #38bdf8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', monospace; font-size: 13px; line-height: 1.5; }

  h1 { font-size: 18px; font-weight: 700; color: var(--text); letter-spacing: .5px; }
  h2 { font-size: 14px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }

  .header { padding: 24px 32px 16px; border-bottom: 1px solid var(--border); }
  .header p { color: var(--muted); font-size: 12px; margin-top: 4px; }

  /* ── Phase timeline ──────────────────────────────── */
  .timeline { display: flex; gap: 0; padding: 20px 32px; overflow-x: auto; }
  .phase-btn {
    flex: 1; min-width: 88px; padding: 10px 4px 8px;
    background: var(--surface); border: 1px solid var(--border);
    border-right: none; color: var(--muted);
    cursor: pointer; text-align: center; transition: all .15s;
    position: relative; user-select: none;
  }
  .phase-btn:first-child { border-radius: 6px 0 0 6px; }
  .phase-btn:last-child  { border-radius: 0 6px 6px 0; border-right: 1px solid var(--border); }
  .phase-btn:hover { background: var(--surface2); color: var(--text); }
  .phase-btn.active { background: var(--surface2); color: var(--text); border-color: var(--info); z-index: 1; }
  .phase-btn .num { font-size: 20px; font-weight: 700; display: block; }
  .phase-btn .lbl { font-size: 10px; color: inherit; }
  .phase-btn .dots { display: flex; gap: 3px; justify-content: center; margin-top: 5px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; }

  /* ── Content area ──────────────────────────────── */
  .content { padding: 16px 32px 40px; }
  .phase-panel { display: none; }
  .phase-panel.active { display: block; }

  /* ── Phase header bar ──────────────────────────── */
  .phase-header {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 16px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 8px 8px 0 0;
    margin-bottom: 0;
  }
  .phase-num { font-size: 28px; font-weight: 800; }
  .phase-name { font-size: 16px; font-weight: 600; }
  .phase-sub  { font-size: 11px; color: var(--muted); }
  .badge {
    padding: 2px 8px; border-radius: 4px; font-size: 10px;
    font-weight: 600; text-transform: uppercase; letter-spacing: .5px;
  }
  .badge-human  { background: #1e293b; color: var(--warn); border: 1px solid var(--warn); }
  .badge-gate2  { background: #052e16; color: var(--gate2); border: 1px solid var(--gate2); }
  .badge-gate3  { background: #1c1107; color: var(--gate3); border: 1px solid var(--gate3); }
  .badge-gate4  { background: #2e0a3a; color: var(--gate4); border: 1px solid var(--gate4); }

  /* ── Main flow grid ────────────────────────────── */
  .flow-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    border: 1px solid var(--border);
    border-top: none;
    border-radius: 0 0 8px 8px;
    overflow: hidden;
  }
  .flow-col {
    padding: 16px;
    border-right: 1px solid var(--border);
  }
  .flow-col:last-child { border-right: none; }
  .col-title {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--muted); margin-bottom: 12px;
    padding-bottom: 8px; border-bottom: 1px solid var(--border);
  }

  /* ── Check blocks ──────────────────────────────── */
  .check-block {
    margin-bottom: 10px; border-radius: 6px;
    border: 1px solid var(--border); overflow: hidden;
  }
  .check-title {
    padding: 6px 10px; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; gap: 7px;
    cursor: pointer; user-select: none;
  }
  .check-title:hover { opacity: .85; }
  .check-body {
    padding: 8px 10px; background: var(--surface);
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--muted);
    display: none;
  }
  .check-body.open { display: block; }

  /* colour themes for check blocks */
  .ck-gate1 { background: #1e1b4b; border-color: var(--gate1); }
  .ck-gate1 .check-title { color: var(--gate1); }
  .ck-gate2 { background: #052e16; border-color: var(--gate2); }
  .ck-gate2 .check-title { color: var(--gate2); }
  .ck-gate3 { background: #1c1107; border-color: var(--gate3); }
  .ck-gate3 .check-title { color: var(--gate3); }
  .ck-gate4 { background: #2e0a3a; border-color: var(--gate4); }
  .ck-gate4 .check-title { color: var(--gate4); }
  .ck-advance { background: #082f49; border-color: var(--advance); }
  .ck-advance .check-title { color: var(--advance); }
  .ck-info { background: var(--surface2); border-color: var(--border); }
  .ck-info .check-title { color: var(--muted); }

  /* ── Dimension pills ───────────────────────────── */
  .dims { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
  .dim {
    padding: 2px 7px; border-radius: 3px; font-size: 10px;
    font-weight: 600; background: #1e293b; color: var(--text);
  }
  .dim.thr90 { background: #1e3a8a; color: #93c5fd; }
  .dim.thr85 { background: #14532d; color: #86efac; }
  .dim.thr80 { background: #422006; color: #fed7aa; }
  .dim.thr70 { background: #1c1107; color: #fbbf24; }
  .dim.thr60 { background: #27272a; color: #a1a1aa; }
  .dim.thr100 { background: #4a044e; color: #f0abfc; }

  /* ── Flow arrows / outcome rows ───────────────── */
  .outcome { display: flex; align-items: flex-start; gap: 8px; margin: 5px 0; padding: 5px 8px; border-radius: 4px; }
  .outcome.pass { background: #052e16; }
  .outcome.fail { background: #2d0a0a; }
  .outcome.warn { background: #1c1107; }
  .outcome.loop { background: #1e1b4b; }
  .outcome-icon { font-size: 13px; flex-shrink: 0; margin-top: 1px; }
  .outcome-text { font-size: 11px; }
  .outcome.pass .outcome-text { color: var(--pass); }
  .outcome.fail .outcome-text { color: var(--fail); }
  .outcome.warn .outcome-text { color: var(--warn); }
  .outcome.loop .outcome-text { color: var(--gate1); }

  /* ── Case list ─────────────────────────────────── */
  .case-list { margin: 6px 0; }
  .case { padding: 4px 8px; border-left: 2px solid var(--border); margin: 3px 0; font-size: 11px; }
  .case.c1 { border-color: var(--pass); color: var(--pass); }
  .case.c2 { border-color: var(--info); color: var(--info); }
  .case.c3 { border-color: var(--warn); color: var(--warn); }
  .case.c4 { border-color: var(--fail); color: var(--fail); }

  /* ── C-check list (C1-C12) ─────────────────────── */
  .c-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin: 6px 0; }
  .c-item {
    padding: 4px 7px; border-radius: 4px; font-size: 10px;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; gap: 5px;
  }
  .c-item .c-id { font-weight: 700; color: var(--advance); min-width: 26px; }
  .c-item .c-sev { font-size: 9px; padding: 1px 4px; border-radius: 2px; margin-left: auto; }
  .sev-crit { background: #7f1d1d; color: #fca5a5; }
  .sev-warn { background: #1c1107; color: #fcd34d; }
  .sev-info { background: #1e293b; color: #93c5fd; }

  /* ── Exit code table ────────────────────────────── */
  .exit-table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 11px; }
  .exit-table td { padding: 3px 8px; border-bottom: 1px solid var(--border); }
  .exit-table td:first-child { font-weight: 700; width: 36px; }
  .exit-table tr:last-child td { border-bottom: none; }
  .ec7  { color: var(--warn); }
  .ec8  { color: var(--crit); }
  .ec11 { color: var(--fail); }
  .ec1  { color: var(--fail); }
  .ec0  { color: var(--pass); }

  /* ── Legend ─────────────────────────────────────── */
  .legend { display: flex; flex-wrap: wrap; gap: 12px; padding: 12px 0; margin-top: 16px; border-top: 1px solid var(--border); }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 10px; color: var(--muted); }
  .legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  .arrow { color: var(--muted); margin: 0 4px; }

  /* ── Threshold legend ───────────────────────────── */
  .thr-legend { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }

  /* scrollable on small screens */
  @media (max-width: 800px) {
    .flow-grid { grid-template-columns: 1fr; }
    .flow-col { border-right: none; border-bottom: 1px solid var(--border); }
  }
</style>
</head>
<body>

<div class="header">
  <h1>Harness Methodology — Phase-End Audit Map</h1>
  <p>每個階段結束前執行的所有自動化檢查 · 點擊階段卡片查看詳細流程 · 點擊檢查區塊展開說明</p>
</div>

<!-- ── Phase selector ─────────────────────────────────── -->
<div class="timeline" id="timeline"></div>

<!-- ── Detail panels ─────────────────────────────────── -->
<div class="content" id="content"></div>

<!-- ── Legend ──────────────────────────────────────────── -->
<div style="padding: 0 32px 32px;">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--gate1)"></div>Gate 1 per-FR</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--gate2)"></div>Gate 2 (P3 exit)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--gate3)"></div>Gate 3 (P4 exit)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--gate4)"></div>Gate 4 (P6 exit)</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--advance)"></div>advance-phase checks</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--warn)"></div>human-gated</div>
    <div style="margin-left:auto;font-size:10px;color:var(--muted);">門檻色碼：
      <span class="dim thr100" style="margin:0 2px;">100</span>
      <span class="dim thr90" style="margin:0 2px;">90</span>
      <span class="dim thr85" style="margin:0 2px;">85</span>
      <span class="dim thr80" style="margin:0 2px;">80</span>
      <span class="dim thr70" style="margin:0 2px;">70</span>
      <span class="dim thr60" style="margin:0 2px;">60</span>
    </div>
  </div>
</div>

<script>
// ── Data ─────────────────────────────────────────────────────────────────
const DIMS_GATE1 = [
  {n:'linting',t:90},{n:'type_safety',t:85},{n:'test_coverage',t:80}
];
const DIMS_GATE2 = [
  {n:'linting',t:90},{n:'type_safety',t:85},{n:'test_coverage',t:80},
  {n:'security',t:80},{n:'secrets_scanning',t:100},{n:'license_compliance',t:100},
  {n:'mutation_testing',t:70},{n:'integration_coverage',t:60},{n:'test_assertion_quality',t:60}
];
const DIMS_GATE34 = [
  ...DIMS_GATE2,
  {n:'D4_imperative ≥60%',t:60},{n:'D4_backward ≥40%',t:60},
  {n:'spec_coverage',t:60},{n:'complexity_score',t:60},{n:'CRG_recon',t:60}
];

const C_CHECKS = [
  {id:'C1',name:'Artifact existence',sev:'CRITICAL'},
  {id:'C2',name:'STAGE_PASS cert',sev:'WARNING'},
  {id:'C3',name:'Constitution compliance',sev:'CRITICAL'},
  {id:'C4',name:'Development log',sev:'WARNING'},
  {id:'C5',name:'Spec coverage',sev:'WARNING'},
  {id:'C6',name:'TDD evidence (D1-RED)',sev:'CRITICAL'},
  {id:'C7',name:'FR coverage ≥80% in DEVLOG',sev:'WARNING'},
  {id:'C8',name:'CI pipeline',sev:'INFO'},
  {id:'C9',name:'Rule violations',sev:'CRITICAL'},
  {id:'C10',name:'Local state',sev:'WARNING'},
  {id:'C11',name:'Plan checklist ✦NEW',sev:'CRITICAL'},
  {id:'C12',name:'Git milestones ✦NEW',sev:'WARNING'},
];

const PHASES = [
  {
    n:1, name:'Specify', sub:'SRS · SPEC_TRACKING · TRACEABILITY',
    badge:null, humanGated:true,
    hasGate1:false, gate1Phases:[],
    exitGate:null,
    artifacts:['01-requirements/SRS.md','01-requirements/SPEC_TRACKING.md','01-requirements/TRACEABILITY_MATRIX.md'],
    advanceFull:false,
    notes:'P1/P2 is human-gated：plan 未完成和 deliverables 缺失只給 WARNING，不 block。advance-phase 不跑 PhaseAuditor。',
    milestones:[],
  },
  {
    n:2, name:'Plan', sub:'SAD',
    badge:null, humanGated:true,
    hasGate1:false,
    exitGate:null,
    artifacts:['02-architecture/SAD.md'],
    advanceFull:false,
    notes:'同 P1：人工把關，plan / deliverable 缺失只警告不封鎖。',
    milestones:[],
  },
  {
    n:3, name:'Implement', sub:'src · tests (TDD)',
    badge:'gate2', humanGated:false,
    hasGate1:true,
    exitGate:{num:2, score:75, dims:DIMS_GATE2, hermes:false, crg:false},
    artifacts:['03-development/src','03-development/tests/'],
    advanceFull:true,
    notes:'每個 FR 完成後先過 Gate 1（local commit）。全部 FR 完成後執行 Gate 2。兩個 milestone push：P3-mid (≥50% FRs) + P3-pre-gate2 (全 FR)。',
    milestones:['p3-mid','p3-pre-gate2'],
  },
  {
    n:4, name:'Verify', sub:'TEST_PLAN · TEST_RESULTS',
    badge:'gate3', humanGated:false,
    hasGate1:true,
    exitGate:{num:3, score:80, dims:DIMS_GATE34, hermes:false, crg:true},
    artifacts:['04-testing/TEST_PLAN.md','04-testing/TEST_RESULTS.md'],
    advanceFull:true,
    notes:'Gate 3 增加 CRG reconnaissance（code review graph）。Delta-check mode：FR 代碼未變則複用上次 Gate 1 分數。',
    milestones:['p4-mid','p4-pre-gate3'],
  },
  {
    n:5, name:'System Test', sub:'BASELINE · VERIFICATION_REPORT',
    badge:null, humanGated:false,
    hasGate1:true,
    exitGate:null,
    artifacts:['05-verification/BASELINE.md','05-verification/VERIFICATION_REPORT.md'],
    advanceFull:true,
    notes:'無 exit gate（P5 以 baseline 為終點，只需通過 Gate 1 + advance-phase prechecks）。',
    milestones:['p5-baseline'],
  },
  {
    n:6, name:'Quality', sub:'QUALITY_REPORT',
    badge:'gate4', humanGated:false,
    hasGate1:false,
    exitGate:{num:4, score:85, dims:DIMS_GATE34, hermes:false, crg:true},
    artifacts:['06-quality/QUALITY_REPORT.md'],
    advanceFull:true,
    notes:'Gate 4 包含 14 個維度的完整質量評估（自動化）+ Devil\'s Advocate challenge + per-dim score files (B2) + issue registry (A5)。最嚴格的 gate。',
    milestones:[],
  },
  {
    n:7, name:'Risk', sub:'RISK_STATUS_REPORT · RISK_REGISTER',
    badge:null, humanGated:false,
    hasGate1:true,
    exitGate:null,
    artifacts:['07-risk/RISK_STATUS_REPORT.md','07-risk/RISK_REGISTER.md'],
    advanceFull:true,
    notes:'無 exit gate。Gate 1 per-FR + advance-phase 6 prechecks。',
    milestones:['p7'],
  },
  {
    n:8, name:'Config', sub:'CONFIG_RECORDS · RELEASE_CHECKLIST',
    badge:null, humanGated:false,
    hasGate1:true,
    exitGate:null,
    artifacts:['08-config/CONFIG_RECORDS.md','08-config/RELEASE_CHECKLIST.md'],
    advanceFull:true,
    notes:'最終 phase。Gate 1 per-FR + advance-phase。通過後 ASPICE 流程完成。',
    milestones:['p8'],
  },
];

function tclass(t){
  if(t===100) return 'thr100';
  if(t>=90)   return 'thr90';
  if(t>=85)   return 'thr85';
  if(t>=80)   return 'thr80';
  if(t>=70)   return 'thr70';
  return 'thr60';
}

function renderDims(dims){
  return `<div class="dims">${dims.map(d=>`<span class="dim ${tclass(d.t)}">${d.n} <b>${d.t}</b></span>`).join('')}</div>`;
}

function renderCChecks(){
  const sevMap = {CRITICAL:'sev-crit',WARNING:'sev-warn',INFO:'sev-info'};
  return `<div class="c-grid">${C_CHECKS.map(c=>`
    <div class="c-item">
      <span class="c-id">${c.id}</span>
      <span>${c.name}</span>
      <span class="c-sev ${sevMap[c.sev]}">${c.sev[0]}</span>
    </div>`).join('')}</div>`;
}

function toggle(id){
  const el = document.getElementById(id);
  el && el.classList.toggle('open');
}

function buildPanel(p){
  const badgeHtml = p.badge ? `<span class="badge badge-${p.badge}">Gate ${p.exitGate.num} Exit</span>` :
                   p.humanGated ? `<span class="badge badge-human">Human-Gated</span>` : '';

  // ── Left col: Gate checks (per-FR + exit) ──
  let leftHtml = '';

  if(p.hasGate1){
    leftHtml += `
    <div class="check-block ck-gate1">
      <div class="check-title" onclick="toggle('g1-${p.n}')">
        <span>⬡</span> Gate 1 — per-FR quality check
        <span style="margin-left:auto;font-size:10px;opacity:.6">▾ 展開</span>
      </div>
      <div class="check-body" id="g1-${p.n}">
        <div style="color:var(--text);margin-bottom:6px;font-size:11px;font-weight:600;">TDD 流程</div>
        <div class="outcome loop">
          <span class="outcome-icon">↺</span>
          <span class="outcome-text">RED → GREEN → IMPROVE 迭代<br><span style="color:var(--muted);">D1-RED：test commit 必須早於 src commit</span></span>
        </div>
        <div style="margin-top:8px;margin-bottom:4px;font-size:10px;color:var(--muted);">評估維度</div>
        ${renderDims(DIMS_GATE1)}
        <div style="margin-top:8px;">
          <div class="outcome pass"><span class="outcome-icon">✓</span><span class="outcome-text">PASS → <b>local commit only</b>（no push）<br>finalize-gate 寫入 quality_manifest.json</span></div>
          <div class="outcome fail"><span class="outcome-icon">✗</span><span class="outcome-text">FAIL → fix code → re-run Gate 1（無次數限制）</span></div>
        </div>
        ${p.n >= 4 ? `<div class="outcome warn" style="margin-top:6px;"><span class="outcome-icon">⚡</span><span class="outcome-text">Delta-check：FR 代碼未變 → 複用前次分數</span></div>` : ''}
        ${p.milestones.length ? `<div style="margin-top:8px;color:var(--muted);font-size:10px;">Milestone pushes：<b style="color:var(--text);">${p.milestones.join(' · ')}</b><br>每次 push 寫入 HANDOVER.md + 推送 origin</div>` : ''}
      </div>
    </div>`;
  }

  if(p.exitGate){
    const eg = p.exitGate;
    const ckClass = `ck-gate${eg.num}`;
    leftHtml += `
    <div class="check-block ${ckClass}">
      <div class="check-title" onclick="toggle('eg-${p.n}')">
        <span>⬢</span> Gate ${eg.num} — Phase ${p.n} Exit &nbsp;(score ≥ ${eg.score})
        <span style="margin-left:auto;font-size:10px;opacity:.6">▾ 展開</span>
      </div>
      <div class="check-body" id="eg-${p.n}">
        <div style="margin-bottom:4px;font-size:10px;color:var(--muted);">評估維度（${eg.dims.length} 個）</div>
        ${renderDims(eg.dims)}
        ${eg.hermes ? `<div class="outcome warn" style="margin-top:8px;"><span class="outcome-icon">📡</span><span class="outcome-text">Hermes APPROVE 必須在 gate 關閉前收到<br><span style="color:var(--muted);">+ Devil's Advocate challenge + per-dim score files (B2) + issue registry (A5)</span></span></div>` : ''}
        ${eg.crg    ? `<div class="outcome loop" style="margin-top:6px;"><span class="outcome-icon">🔍</span><span class="outcome-text">CRG reconnaissance（code review graph）掃描</span></div>` : ''}
        <div style="margin-top:10px;font-size:10px;color:var(--muted);margin-bottom:4px;">Early-Stop 機制（4 cases）</div>
        <div class="case-list">
          <div class="case c1">CASE 1 PASS &nbsp;— score ≥ gate AND critical == 0 → quality_complete = True → 繼續</div>
          <div class="case c2">CASE 2 CONTINUE — score ≥ gate 但有 issue → fix → 重跑 run-gate → finalize-gate</div>
          <div class="case c3">CASE 3 PLATEAU — 連續 3 輪無新 issue → deferred_fixes.md → 可繼續</div>
          <div class="case c4">CASE 4 BLOCKED — max_rounds 耗盡未 PASS → GateBlockedError → 升級人工處理</div>
        </div>
        <div style="margin-top:8px;">
          <div class="outcome pass"><span class="outcome-icon">✓</span><span class="outcome-text">PASS → finalize-gate 寫入 quality_manifest + STAGE_PASS.md 生成</span></div>
          <div class="outcome fail"><span class="outcome-icon">✗</span><span class="outcome-text">FAIL → fix → re-run run-gate → finalize-gate（迭代）</span></div>
        </div>
      </div>
    </div>`;
  }

  if(!p.hasGate1 && !p.exitGate){
    leftHtml += `<div class="check-block ck-info">
      <div class="check-title"><span>ℹ</span> 無質量 Gate（human-gated）</div>
    </div>
    <div style="color:var(--muted);font-size:11px;padding:8px 0;">${p.notes}</div>`;
  }

  // ── Right col: advance-phase prechecks ──
  let rightHtml = '';
  if(p.advanceFull){
    rightHtml = `
    <div class="check-block ck-advance">
      <div class="check-title" onclick="toggle('ap-${p.n}')">
        <span>▶</span> advance-phase — 6 prechecks
        <span style="margin-left:auto;font-size:10px;opacity:.6">▾ 展開</span>
      </div>
      <div class="check-body" id="ap-${p.n}">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;">執行順序（第一個失敗即 block）</div>
        <table class="exit-table">
          <tr><td class="ec7">7</td><td><b>#1 Plan completion</b> — phase{N}_plan.md 有未勾選必填項 → exit 7</td></tr>
          <tr><td class="ec8">8</td><td><b>#2 PhaseArtifactRegistry</b> — deliverables 不存在或未 git-tracked → exit 8</td></tr>
          <tr><td style="color:var(--muted);">ℹ</td><td><b>#3 P1 checksum</b> — TEST_INVENTORY.yaml SHA 寫入 state.json（info only）</td></tr>
          <tr><td class="ec1">1</td><td><b>#4 Gate score variance</b> — 所有 FR Gate 分數相同（>2 FRs）→ exit 1（suspicious）</td></tr>
          <tr><td class="ec11">11</td><td><b>#5 Phase Truth HR-11</b> — 實際 pytest 執行，覆蓋率 < 90% → exit 11</td></tr>
          <tr><td class="ec1">1</td><td><b>#6 PhaseAuditor C1-C12</b> — CRITICAL finding → exit 1</td></tr>
          <tr><td class="ec0">0</td><td>全部通過 → advance FSM → 寫 HANDOVER.md → local commit</td></tr>
        </table>
      </div>
    </div>

    <div class="check-block ck-advance" style="margin-top:8px;">
      <div class="check-title" onclick="toggle('cc-${p.n}')">
        <span>◈</span> PhaseAuditor C1–C12（#6 子項）
        <span style="margin-left:auto;font-size:10px;opacity:.6">▾ 展開</span>
      </div>
      <div class="check-body" id="cc-${p.n}">
        <div style="font-size:10px;color:var(--muted);margin-bottom:6px;">
          CRITICAL → exit 1（block）&nbsp;&nbsp;WARNING → advisory only
        </div>
        ${renderCChecks()}
        <div style="margin-top:8px;">
          <div class="outcome pass"><span class="outcome-icon">✓</span><span class="outcome-text">0 CRITICAL → score + verdict 輸出，繼續</span></div>
          <div class="outcome fail"><span class="outcome-icon">✗</span><span class="outcome-text">≥1 CRITICAL → 列出前 5 條，exit 1，指引 audit-phase 指令</span></div>
          <div class="outcome warn"><span class="outcome-icon">⚠</span><span class="outcome-text">WARNING only → 列出數量，advisory，不 block</span></div>
        </div>
      </div>
    </div>

    <div style="margin-top:12px;padding:8px;background:var(--surface2);border-radius:5px;font-size:10px;color:var(--muted);border:1px solid var(--border);">
      Required deliverables：<br>
      ${p.artifacts.map(a=>`<code style="color:var(--text);">${a}</code>`).join(' &nbsp;·&nbsp; ')}
    </div>`;
  } else {
    rightHtml = `
    <div class="check-block ck-info">
      <div class="check-title"><span>△</span> advance-phase — 輕量模式（P1/P2）</div>
    </div>
    <div style="padding:10px;background:var(--surface2);border-radius:5px;font-size:11px;color:var(--muted);border:1px solid var(--border);margin-top:8px;">
      <b style="color:var(--warn);">⚠ Human-Gated</b><br>
      Plan 未勾選 / deliverables 缺失 → 僅 WARNING，不 block（human 把關）<br>
      不執行 Phase Truth、Gate score variance、PhaseAuditor C1-C12。
    </div>
    <div style="margin-top:10px;padding:8px;background:var(--surface2);border-radius:5px;font-size:10px;color:var(--muted);border:1px solid var(--border);">
      Required deliverables：<br>
      ${p.artifacts.map(a=>`<code style="color:var(--text);">${a}</code>`).join(' &nbsp;·&nbsp; ')}
    </div>`;
  }

  // dot indicators in timeline
  const dots = [];
  if(p.hasGate1) dots.push({c:'var(--gate1)',t:'Gate1'});
  if(p.exitGate) dots.push({c:`var(--gate${p.exitGate.num})`,t:`G${p.exitGate.num}`});
  if(p.advanceFull) dots.push({c:'var(--advance)',t:'Adv'});
  if(p.humanGated) dots.push({c:'var(--warn)',t:'HG'});

  return { dots, panel:`
  <div class="phase-panel" id="panel-${p.n}">
    <div class="phase-header">
      <span class="phase-num" style="color:${p.humanGated?'var(--warn)':p.exitGate?`var(--gate${p.exitGate.num})`:'var(--advance)'}">P${p.n}</span>
      <div>
        <div class="phase-name">${p.name}</div>
        <div class="phase-sub">${p.sub}</div>
      </div>
      ${badgeHtml}
      ${p.milestones.length ? `<span style="margin-left:auto;font-size:10px;color:var(--muted);">milestone：${p.milestones.join(' · ')}</span>` : ''}
    </div>
    <div class="flow-grid">
      <div class="flow-col">
        <div class="col-title">質量 Gate 檢查</div>
        ${leftHtml}
      </div>
      <div class="flow-col">
        <div class="col-title">advance-phase 前置檢查</div>
        ${rightHtml}
      </div>
    </div>
    ${p.notes && (p.hasGate1 || p.exitGate) ? `<div style="margin-top:8px;padding:8px 12px;background:var(--surface);border:1px solid var(--border);border-radius:5px;font-size:11px;color:var(--muted);">ℹ &nbsp;${p.notes}</div>` : ''}
  </div>`};
}

// ── Build DOM ──────────────────────────────────────────────────────────────
const tl = document.getElementById('timeline');
const ct = document.getElementById('content');

PHASES.forEach((p,i)=>{
  const {dots, panel} = buildPanel(p);

  const btn = document.createElement('div');
  btn.className = 'phase-btn' + (i===0?' active':'');
  btn.id = `btn-${p.n}`;
  btn.innerHTML = `
    <span class="num">P${p.n}</span>
    <span class="lbl">${p.name}</span>
    <div class="dots">${dots.map(d=>`<div class="dot" style="background:${d.c}" title="${d.t}"></div>`).join('')}</div>
  `;
  btn.onclick = () => {
    document.querySelectorAll('.phase-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.phase-panel').forEach(pp=>pp.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(`panel-${p.n}`).classList.add('active');
  };
  tl.appendChild(btn);

  ct.insertAdjacentHTML('beforeend', panel);
});

// activate P1
document.getElementById('panel-1').classList.add('active');
</script>
</body>
</html>

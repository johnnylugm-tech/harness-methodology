[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-methodology"
version = "2.7.0"
description = "Full-lifecycle software development pipeline orchestration with 12-dimension quality gates, A/B collaboration, and proactive auto-repair"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Johnny Lugm"},
]
dependencies = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[tool.setuptools.packages.find]
include = ["core*", "harness*", "enforcement*", "detection*", "gap_detector*", "kill_switch*", "steering*", "orchestration*", "constitution*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
markers = [
    "core: Core pipeline tests (fast, always run)",
    "extended: Extended integration tests (medium, run on PR)",
    "integration: Full integration tests (slow, run on merge to main)",
    "gate: Gate evaluation tests (critical path)",
    "slow: Tests that take >10 seconds",
    "constitution: Constitution compliance tests",
    "auto_fix: Auto-fix engine tests",
    "smoke: Quick smoke tests (run on every commit)",
    "contract: Spec contract compliance tests",
    "quality: Quality gate dimension tests",
]

[project.optional-dependencies]
watch = ["watchdog>=3.0"]

# mutmut 3.x reads setup.cfg [mutmut], not pyproject.toml.
# See setup.cfg for the mutation test configuration.
# Run: mutmut run && mutmut results

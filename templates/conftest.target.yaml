# Copy to target project's conftest.py and customize.
# This file is a TEMPLATE: it documents the pytest markers that init-project
# expects for TDD quality gates.  Copy the contents to your project's
# tests/conftest.py (or root conftest.py) and assert the markers.

import pytest


def pytest_configure(config):
    """Register test type markers for tiered quality gates."""
    markers = [
        ("unit", "pure unit test (all external deps mocked)"),
        ("integration", "integration test (real HTTP / real DB / real FS)"),
        ("security", "security / red team test (injection, rate-limit, auth)"),
        ("kpi", "KPI validation test (latency, throughput, FCR target)"),
    ]
    for name, desc in markers:
        config.addinivalue_line("markers", f"{name}: {desc}")


def pytest_collection_modifyitems(config, items):
    """Auto-assign 'unit' marker to unmarked tests (lowers migration cost)."""
    known = {"unit", "integration", "security", "kpi", "parametrize",
             "skip", "skipif", "xfail"}
    for item in items:
        item_markers = {m.name for m in item.iter_markers()}
        if not (item_markers & known):
            item.add_marker(pytest.mark.unit)

# Harness Quality Gate — CI workflow template
# Auto-generated by harness-init.sh or init-project; or copy manually to .github/workflows/
# Kept in sync with INTEGRATION.md §4 Option A.
#
# Push directly to main — no PR required.
# Blocking is via local pre-push hook (harness/scripts/harness-init.sh) + this CI gate.
# If CI fails after push, fix and push again; CI re-evaluates on the next push.
#
# No CURRENT_PHASE variable needed — phase is auto-detected from .methodology/state.json.
name: Harness Quality Gate

on:
  push:
    branches: [main]

jobs:
  gate-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0  # Full history required for phase boundary commit verification

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install harness dependencies
        run: |
          # pyyaml required for gate score variance check
          pip install -r harness/requirements.txt || true
          pip install pyyaml 2>/dev/null || true

      - name: Auto-detect phase from state.json
        id: phase
        run: |
          # Read phase from project's own state.json — the single source of truth.
          # Local hooks, CLI commands, and CI all read .methodology/state.json::current_phase.
          PHASE=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('.methodology/state.json'))
              print(d.get('current_phase', d.get('phase', 1)))
          except Exception:
              print(1)
          " 2>/dev/null || echo "1")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT
          echo "Detected phase: $PHASE (from .methodology/state.json)"

      - name: Run Phase Preflight (FSM / drift / constitution)
        # Structural enforcement only (FSM state, constitution, drift, traceability).
        # Gate score evaluation requires an interactive Claude session — always local.
        # Gate 4 (P6 exit) also requires human Hermes APPROVE — run locally, not in CI.
        # G-02 fix: P6 no longer skipped — run-phase --phase 6 is safe in CI (no interactive gate eval).
        env:
          PHASE: ${{ steps.phase.outputs.PHASE }}
        run: python harness/harness_cli.py run-phase --phase $PHASE --project .

      - name: Gate Score Variance Check
        # Detects fabricated gate scores: if all per-FR Gate1 scores in the phase are
        # identical, they were likely copied rather than evaluated per FR.
        # Only checks entries where fr_id is non-null (per-FR scores); aggregate Gate2/Gate4
        # scores (fr_id=null) are excluded so one different aggregate score can't mask fraud.
        env:
          PHASE: ${{ steps.phase.outputs.PHASE }}
        run: |
          python3 - <<'EOF'
          import glob, sys, os
          try:
              import yaml
          except ImportError:
              print("pyyaml not available — skipping variance check")
              sys.exit(0)
          phase = int(os.environ.get("PHASE", "1"))
          logs = glob.glob(f".methodology/decision_logs/**/GATE_{phase}_*.yaml", recursive=True)
          scores = []
          for lf in logs:
              try:
                  d = yaml.safe_load(open(lf))
                  if (d or {}).get("ctx", {}).get("fr_id") is None:
                      continue  # skip aggregate (Gate2/Gate4) entries
                  s = (d or {}).get("scores", {}).get("gate_score")
                  if s is not None:
                      scores.append(float(s))
              except Exception:
                  pass
          if len(scores) > 2 and len(set(scores)) == 1:
              print(f"FAIL: All {len(scores)} per-FR gate scores identical ({scores[0]}) for phase {phase}.")
              print("      Scores must vary per FR — identical scores indicate fabrication.")
              sys.exit(1)
          print(f"OK: Gate score variance check passed ({len(scores)} per-FR entries for phase {phase}).")
          EOF

      - name: FR Traceability Check
        # G-05 fix: continue-on-error removed — now blocks if FR→test mapping fails.
        env:
          PHASE: ${{ steps.phase.outputs.PHASE }}
        run: python harness/scripts/check_fr_full.py --phase $PHASE

  push-milestone-enforcement:
    name: Enforce push-milestone (no --no-verify bypass)
    runs-on: ubuntu-latest
    # Only enforce on pushes to main — PRs may legitimately lack state.json
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check last_milestone_command in state.json
        run: |
          STATE_FILE=".methodology/state.json"
          if [ ! -f "$STATE_FILE" ]; then
            echo "INFO: No state.json found — project not yet initialized, skipping."
            exit 0
          fi
          # CV-5: safe JSON parsing — corrupt/empty state.json defaults to 0
          # so CI emits a clear error instead of dying with a Python traceback.
          PHASE=$(python3 -c "
import json, sys
try:
    d = json.load(open('$STATE_FILE'))
    print(d.get('current_phase', 0))
except Exception as e:
    print(f'[WARN] state.json unreadable: {e}', file=sys.stderr)
    print(0)
")
          if [ "$PHASE" -lt 3 ]; then
            echo "INFO: Phase $PHASE < 3 — push-milestone not yet required."
            exit 0
          fi
          CMD=$(python3 -c "
import json, sys
try:
    d = json.load(open('$STATE_FILE'))
    print(d.get('last_milestone_command', ''))
except Exception as e:
    print(f'[WARN] state.json unreadable: {e}', file=sys.stderr)
    print('')
")
          if [ -z "$CMD" ]; then
            echo "ERROR: state.json has no last_milestone_command field."
            echo "Direct git push detected. Use instead:"
            echo "  python harness/harness_cli.py push-milestone --type <type> --project ."
            exit 1
          fi
          echo "OK: last_milestone_command = $CMD"

  p1p2-enforcement:
    name: P1/P2 Push-Checkpoint Enforcement
    runs-on: ubuntu-latest
    # --no-verify skips local hooks but not CI. This job is the server-side gate.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install harness dependencies
        run: pip install -r harness/requirements.txt || true

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT
          echo "Detected phase: $PHASE"

      - name: Verify P1 artifacts exist (P2 entry gate)
        # G-11 fix: server-side backup for [P1-ARTIFACTS] entry gate check.
        if: steps.phase.outputs.PHASE == '2'
        run: |
          MISSING=""
          for f in "01-requirements/SRS.md" \
                   "01-requirements/SPEC_TRACKING.md" \
                   "01-requirements/TRACEABILITY_MATRIX.md" \
                   "TEST_INVENTORY.yaml"; do
            [ -f "$f" ] || MISSING="$MISSING $f"
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: P2 entry requires all 4 Phase 1 artifacts (CONSTITUTION.md §2.3)."
            echo "Missing:$MISSING"
            exit 1
          fi
          echo "OK: all 4 P1 artifacts present."

      - name: Verify push-checkpoint sentinel (P1/P2)
        # push-checkpoint writes last_push_checkpoint to state.json.
        # Absent = agent used raw git push --no-verify, bypassing all gates.
        if: steps.phase.outputs.PHASE == '1' || steps.phase.outputs.PHASE == '2'
        run: |
          SENTINEL=$(python3 -c "
          import json, sys
          try:
              d = json.load(open('.methodology/state.json'))
              print(d.get('last_push_checkpoint', ''))
          except Exception:
              print('')
          " 2>/dev/null || echo "")
          if [ -z "$SENTINEL" ]; then
            echo "ERROR: state.json has no last_push_checkpoint field."
            echo "Direct git push detected — push-checkpoint was never called."
            echo "Use: python harness/harness_cli.py push-checkpoint --phase ${{ steps.phase.outputs.PHASE }} --project ."
            echo "Do NOT bypass with: git push --no-verify"
            exit 1
          fi
          echo "OK: last_push_checkpoint = $SENTINEL"

      - name: Verify HANDOVER.md exists (P1/P2)
        if: steps.phase.outputs.PHASE == '1' || steps.phase.outputs.PHASE == '2'
        run: |
          if [ ! -f "HANDOVER.md" ]; then
            echo "ERROR: HANDOVER.md missing."
            echo "push-checkpoint generates HANDOVER.md. Missing = checkpoint was bypassed."
            exit 1
          fi
          echo "OK: HANDOVER.md present."

      - name: Verify Agent B approvals exist (P1/P2)
        if: steps.phase.outputs.PHASE == '1' || steps.phase.outputs.PHASE == '2'
        run: |
          APPROVALS=$(find .methodology/agent_b_approvals -name "*.json" 2>/dev/null | wc -l || echo 0)
          if [ "$APPROVALS" -eq 0 ]; then
            echo "ERROR: No Agent B approval files in .methodology/agent_b_approvals/"
            echo "Run: python harness/harness_cli.py dispatch --role reviewer --fr-id <FR-ID> --phase ${{ steps.phase.outputs.PHASE }} --project ."
            exit 1
          fi
          APPROVED=$(python3 -c "
          import json, glob, sys
          files = glob.glob('.methodology/agent_b_approvals/*.json')
          n = sum(1 for f in files if json.load(open(f)).get('review_status') == 'APPROVE')
          print(n)
          " 2>/dev/null || echo 0)
          if [ "$APPROVED" -eq 0 ]; then
            echo "ERROR: No Agent B approval file has review_status=APPROVE."
            exit 1
          fi
          echo "OK: $APPROVED Agent B APPROVE file(s) found."

      - name: Verify sessions_spawn.log has A/B entries (P1/P2)
        # G-07 fix: CI backup for sessions_spawn.log A/B round count.
        if: steps.phase.outputs.PHASE == '1' || steps.phase.outputs.PHASE == '2'
        run: |
          LOG=".methodology/sessions_spawn.log"
          if [ ! -f "$LOG" ]; then
            echo "ERROR: sessions_spawn.log missing (HR-10)."
            echo "AgentSpawner must log each A/B round. File not found."
            exit 1
          fi
          ENTRIES=$(grep -c '.' "$LOG" || echo 0)
          if [ "$ENTRIES" -eq 0 ]; then
            echo "ERROR: sessions_spawn.log is empty (HR-10)."
            echo "At least one A/B round must be logged."
            exit 1
          fi
          echo "OK: sessions_spawn.log has $ENTRIES line(s)."

  checklist-check:
    name: Phase Plan Checklist Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install harness dependencies
        run: pip install -r harness/requirements.txt || true

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: Check mandatory checklist items in phase plan
        run: |
          PLAN=".methodology/phase${{ steps.phase.outputs.PHASE }}_plan.md"
          if [ ! -f "$PLAN" ]; then
            echo "INFO: $PLAN not found — skipping checklist check."
            exit 0
          fi
          python harness/harness_cli.py check-checklist \
            --phase ${{ steps.phase.outputs.PHASE }} \
            --project . || {
              echo ""
              echo "Mandatory plan items are unchecked in $PLAN."
              echo "Change '- [ ]' to '- [x]' for each completed step."
              exit 1
            }

  agent-b-approval-check:
    name: Agent B Approval Verification
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install harness dependencies
        run: pip install -r harness/requirements.txt || true

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: Verify Agent B approvals (P3+)
        # P1/P2 approval check is handled by p1p2-enforcement job.
        if: steps.phase.outputs.PHASE >= 3
        run: |
          python harness/harness_cli.py verify-agent-b-approvals \
            --phase ${{ steps.phase.outputs.PHASE }} \
            --project . || {
              echo ""
              echo "Agent B review files missing or non-APPROVE."
              echo "Each FR needs .methodology/agent_b_approvals/FR-XX.json"
              echo "with review_status=APPROVE and docs_embedded=[SRS.md, SAD.md]"
              exit 1
            }

  p8-archive-check:
    name: P8 Archive & HANDOVER Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Detect if P8 milestone was pushed
        id: p8
        run: |
          STATE_FILE=".methodology/state.json"
          IS_P8="false"
          if [ -f "$STATE_FILE" ]; then
            # CV-5: safe parse — corrupt state.json defaults to empty string.
            CMD=$(python3 -c "
import json, sys
try:
    d = json.load(open('$STATE_FILE'))
    print(d.get('last_milestone_command', ''))
except Exception as e:
    print(f'[WARN] state.json unreadable: {e}', file=sys.stderr)
    print('')
")
            if echo "$CMD" | grep -q "p8"; then
              IS_P8="true"
            fi
          fi
          echo "IS_P8=$IS_P8" >> $GITHUB_OUTPUT

      - name: Validate .methodology-archive exists (P8 only)
        if: steps.p8.outputs.IS_P8 == 'true'
        run: |
          if [ ! -d ".methodology-archive" ]; then
            echo "ERROR: .methodology-archive/ does not exist."
            echo "Archive all phase artifacts before P8 push."
            exit 1
          fi
          echo "OK: .methodology-archive/ exists."

      - name: Validate HANDOVER.md has no Phase 9 references (P8 only)
        if: steps.p8.outputs.IS_P8 == 'true'
        run: |
          if [ -f "HANDOVER.md" ]; then
            if grep -qi "phase 9\|phase9\|phase9_plan" HANDOVER.md; then
              echo "ERROR: HANDOVER.md references non-existent Phase 9."
              grep -ni "phase 9\|phase9" HANDOVER.md || true
              exit 1
            fi
            echo "OK: HANDOVER.md has no Phase 9 references."
          fi

  d4-backward-check:
    # G-03 fix: CI backup for D4 backward spec-coverage-check (local-only before this).
    name: D4 Backward Spec Coverage Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install harness dependencies
        run: pip install -r harness/requirements.txt || true

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: D4 backward spec-coverage-check
        env:
          PHASE: ${{ steps.phase.outputs.PHASE }}
        run: |
          # Threshold per gate: Gate2/P3=40%, Gate3/P4=70%, Gate4/P6=90%, others=40%
          python3 - <<'EOF'
          import os, sys, subprocess
          phase = int(os.environ.get("PHASE", "0"))
          thresholds = {3: 40.0, 4: 70.0, 6: 90.0}
          threshold = thresholds.get(phase, 40.0)
          if phase < 3:
              print(f"INFO: Phase {phase} < 3 — spec-coverage-check not required.")
              sys.exit(0)
          result = subprocess.run(
              ["python", "harness/harness_cli.py", "spec-coverage-check",
               "--project", ".", "--threshold", str(threshold)],
              capture_output=True, text=True
          )
          print(result.stdout)
          if result.returncode != 0:
              print(f"FAIL: D4 backward spec-coverage < {threshold:.0f}% for phase {phase}.")
              sys.exit(1)
          print(f"OK: D4 backward spec-coverage >= {threshold:.0f}%")
          EOF

  phase-truth-check:
    # G-04 fix: CI backup for Phase Truth >= 90% (HR-11), previously local-only via advance-phase.
    name: Phase Truth >= 90% Check (HR-11)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Check phase_truth_passed in state.json
        run: |
          python3 - <<'EOF'
          import json, sys
          try:
              d = json.load(open('.methodology/state.json'))
          except Exception:
              print("INFO: state.json not found — skipping.")
              sys.exit(0)
          phase = int(d.get('current_phase', 0))
          exit_gate_phases = {3, 4, 6}
          if phase not in exit_gate_phases:
              print(f"INFO: Phase {phase} has no exit gate — phase_truth_passed not required.")
              sys.exit(0)
          passed = d.get('phase_truth_passed', None)
          if passed is True:
              print(f"OK: phase_truth_passed = True for Phase {phase}.")
              sys.exit(0)
          print(f"FAIL: phase_truth_passed = {passed!r} for Phase {phase}.")
          print("  Phase Truth < 90% or not yet recorded. Run finalize-gate to set it.")
          sys.exit(1)
          EOF

  sab-validation:
    # G-10 fix: CI validation for SAB.json (previously no CI check existed).
    name: SAB.json Schema Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: Validate SAB.json (P3+)
        if: steps.phase.outputs.PHASE >= 3
        run: |
          python3 - <<'EOF'
          import json, sys
          sab_path = ".methodology/SAB.json"
          try:
              d = json.load(open(sab_path))
          except FileNotFoundError:
              print(f"ERROR: {sab_path} not found.")
              print("Run: python harness/scripts/generate_sab.py --project .")
              sys.exit(1)
          except Exception as e:
              print(f"ERROR: {sab_path} is not valid JSON: {e}")
              sys.exit(1)
          modules = d.get("modules", [])
          if not modules:
              print(f"ERROR: SAB.json has no modules. Re-run generate_sab.py.")
              sys.exit(1)
          layers = d.get("layers", [])
          print(f"OK: SAB.json valid — {len(modules)} module(s), {len(layers)} layer(s).")
          EOF

  phase-end-audit-check:
    # G-12 + G-08 fix: CI check that Phase End Audit CRITICAL gaps are cleared before advancing.
    name: Phase End Audit — No CRITICAL Gaps
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: Check previous phase audit for CRITICAL gaps (P4+)
        # Phase End Audit is P3+ only. We check phase N-1's audit when in phase N (N>=4).
        # audit_gaps_N.md marks unchecked CRITICAL items as "- [ ]" under "## CRITICAL Gaps".
        if: steps.phase.outputs.PHASE >= 4
        env:
          PHASE: ${{ steps.phase.outputs.PHASE }}
        run: |
          python3 - <<'EOF'
          import os, sys, re
          phase = int(os.environ.get("PHASE", "0"))
          prev = phase - 1
          audit_file = f".methodology/audit_gaps_{prev}.md"
          if not os.path.exists(audit_file):
              print(f"INFO: {audit_file} not found — Phase End Audit may not have run for P{prev}.")
              print(f"      Run: python harness/scripts/phase_end_audit.py --phase {prev} --project .")
              # Non-blocking if file doesn't exist yet (first push after advance-phase).
              sys.exit(0)
          content = open(audit_file).read()
          critical_section = re.search(
              r'## CRITICAL Gaps.*?(?=## |\Z)', content, re.DOTALL
          )
          if not critical_section:
              print(f"OK: No CRITICAL Gaps section in {audit_file}.")
              sys.exit(0)
          unchecked = re.findall(r'^- \[ \]', critical_section.group(0), re.MULTILINE)
          if unchecked:
              print(f"FAIL: {audit_file} has {len(unchecked)} unchecked CRITICAL gap(s).")
              print("Fix all CRITICAL gaps before advancing to the next phase.")
              print(content)
              sys.exit(1)
          print(f"OK: {audit_file} — no unchecked CRITICAL gaps.")
          EOF

  deliverable-existence-check:
    # G-13 + G-15 fix: CI check for phase deliverables existence (TEST_PLAN, VERIFICATION_REPORT, etc.).
    name: Phase Deliverables Existence Check
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: Check phase deliverables exist
        env:
          PHASE: ${{ steps.phase.outputs.PHASE }}
        run: |
          python3 - <<'EOF'
          import os, sys
          phase = int(os.environ.get("PHASE", "0"))
          # Deliverables required to exist when entering each phase.
          required = {
              4: ["04-testing/TEST_PLAN.md"],
              5: ["04-testing/TEST_PLAN.md", "04-testing/TEST_RESULTS.md"],
              6: ["05-verification/VERIFICATION_REPORT.md", "05-verification/BASELINE.md"],
              7: ["06-quality/QUALITY_REPORT.md"],
              8: ["07-risk/RISK_STATUS_REPORT.md"],
          }
          missing = []
          for p, files in required.items():
              if phase >= p:
                  for f in files:
                      if not os.path.exists(f):
                          missing.append(f"[Phase {p}+] {f}")
          if missing:
              print("FAIL: Expected deliverables missing:")
              for m in missing:
                  print(f"  {m}")
              sys.exit(1)
          print(f"OK: all expected deliverables present for phase {phase}.")
          EOF

  aspice-trace-check:
    # G-14 fix: CI enforcement of ASPICE traceability (TH-01), previously local-only.
    name: ASPICE Traceability Check (TH-01)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install harness dependencies
        run: pip install -r harness/requirements.txt || true

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: Run ASPICE trace-check (P4+)
        if: steps.phase.outputs.PHASE >= 4
        run: python harness/harness_cli.py trace-check --project .

  hermes-approve-check:
    # G-16 fix: CI verification that Hermes APPROVE receipt exists before P7+.
    name: Hermes APPROVE Receipt Verification (P7+)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: Verify hermes_g4_receipt.json exists (P7+)
        if: steps.phase.outputs.PHASE >= 7
        run: |
          python3 - <<'EOF'
          import json, sys
          receipt_path = ".methodology/hermes_g4_receipt.json"
          try:
              d = json.load(open(receipt_path))
          except FileNotFoundError:
              print(f"ERROR: {receipt_path} not found.")
              print("Gate 4 requires Hermes APPROVE before finalize-gate --gate 4.")
              print("hermes_g4_receipt.json is written by finalize-gate upon APPROVE receipt.")
              sys.exit(1)
          except Exception as e:
              print(f"ERROR: {receipt_path} is not valid JSON: {e}")
              sys.exit(1)
          approved_by = d.get("approved_by")
          if not approved_by:
              print(f"ERROR: hermes_g4_receipt.json has no 'approved_by' field.")
              sys.exit(1)
          score = d.get("composite_score", "?")
          ts = d.get("ts", "?")
          print(f"OK: Gate 4 approved by={approved_by!r}, score={score}, ts={ts}")
          EOF

  gate4-tag-check:
    # G-17 fix: CI verification that Gate 4 git tag was pushed (previously local-only manual step).
    name: Gate 4 Git Tag Verification (P7+)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for tag lookup

      - name: Detect phase
        id: phase
        run: |
          PHASE=$(python3 -c "
          import json
          try:
              d = json.load(open('.methodology/state.json'))
              print(int(d.get('current_phase', 0)))
          except Exception:
              print(0)
          " 2>/dev/null || echo "0")
          echo "PHASE=$PHASE" >> $GITHUB_OUTPUT

      - name: Verify harness-v4-* tag exists (P7+)
        if: steps.phase.outputs.PHASE >= 7
        run: |
          if git tag | grep -q "^harness-v4-"; then
            echo "OK: harness-v4-* tag found."
            git tag | grep "^harness-v4-"
          else
            echo "ERROR: No harness-v4-* tag found."
            echo "After Gate 4 PASS, tag the commit:"
            echo "  git tag -a 'harness-v4-YYYYMMDD-scoreXX' -m 'Gate 4 PASS'"
            echo "  git push origin --tags"
            exit 1
          fi
